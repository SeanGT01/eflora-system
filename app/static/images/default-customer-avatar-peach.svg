<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Cute Flower Avatar - Peach Coral">
  <defs>
    <linearGradient id="bgGrad_peach" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF8F5"/>
      <stop offset="100%" stop-color="#FBE9E7"/>
    </linearGradient>
    <linearGradient id="petalGrad_peach" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFCCBC"/>
      <stop offset="100%" stop-color="#FF8A65"/>
    </linearGradient>
    <linearGradient id="centerGrad_peach" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF59D"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
    <filter id="shadow_peach" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Background Circle with Border -->
  <circle cx="60" cy="60" r="57" fill="url(#bgGrad_peach)" stroke="#FFCCBC" stroke-width="2.5"/>

  <!-- Little Green Stem & Leaf -->
  <path d="M 60 76 Q 60 96 55 106" fill="none" stroke="#66BB6A" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 58 92 C 50 92 46 98 48 102 C 53 103 57 97 58 92 Z" fill="#66BB6A"/>

  <!-- 6 Puffy Petals (Angle 0, 60, 120, 180, 240, 300) -->
  <g filter="url(#shadow_peach)">
    <!-- Petal 1 (Top) -->
    <ellipse cx="60" cy="34" rx="14" ry="17" fill="url(#petalGrad_peach)"/>
    <!-- Petal 2 (Top Right) -->
    <ellipse cx="81.5" cy="46.5" rx="14" ry="17" fill="url(#petalGrad_peach)" transform="rotate(60 81.5 46.5)"/>
    <!-- Petal 3 (Bottom Right) -->
    <ellipse cx="81.5" cy="73.5" rx="14" ry="17" fill="url(#petalGrad_peach)" transform="rotate(120 81.5 73.5)"/>
    <!-- Petal 4 (Bottom) -->
    <ellipse cx="60" cy="86" rx="14" ry="17" fill="url(#petalGrad_peach)"/>
    <!-- Petal 5 (Bottom Left) -->
    <ellipse cx="38.5" cy="73.5" rx="14" ry="17" fill="url(#petalGrad_peach)" transform="rotate(240 38.5 73.5)"/>
    <!-- Petal 6 (Top Left) -->
    <ellipse cx="38.5" cy="46.5" rx="14" ry="17" fill="url(#petalGrad_peach)" transform="rotate(300 38.5 46.5)"/>

    <!-- Flower Center -->
    <circle cx="60" cy="60" r="22" fill="url(#centerGrad_peach)"/>
  </g>

  <!-- Cute Smiling Face -->
  <!-- Left Eye -->
  <circle cx="53" cy="58" r="2.6" fill="#3D2B1F"/>
  <circle cx="52.2" cy="57.2" r="0.9" fill="#FFFFFF"/>
  <!-- Right Eye -->
  <circle cx="67" cy="58" r="2.6" fill="#3D2B1F"/>
  <circle cx="66.2" cy="57.2" r="0.9" fill="#FFFFFF"/>

  <!-- Cheeks -->
  <ellipse cx="49" cy="62.5" rx="3.5" ry="2" fill="#FF3D00" opacity="0.6"/>
  <ellipse cx="71" cy="62.5" rx="3.5" ry="2" fill="#FF3D00" opacity="0.6"/>

  <!-- Smile -->
  <path d="M 57 62 Q 60 65.5 63 62" fill="none" stroke="#3D2B1F" stroke-width="1.8" stroke-linecap="round"/>
</svg>