<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Default profile">
  <defs>
    <linearGradient id="bg" x1="18" y1="12" x2="102" y2="108" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFCF8"/>
      <stop offset="0.42" stop-color="#F9EEF2"/>
      <stop offset="1" stop-color="#EEC4D0"/>
    </linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#D4788A"/>
      <stop offset="1" stop-color="#C24E68"/>
    </linearGradient>
    <linearGradient id="roseLight" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#F2C4CE"/>
      <stop offset="1" stop-color="#E8A0B0"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#9BBEA0"/>
      <stop offset="1" stop-color="#6B9E72"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="50%">
      <stop stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="60" cy="60" r="58" fill="url(#bg)" stroke="#F2C4CE" stroke-width="2"/>
  <circle cx="60" cy="60" r="58" fill="url(#glow)"/>
  <!-- soft decorative petals -->
  <ellipse cx="28" cy="34" rx="10" ry="14" fill="#F2C4CE" opacity="0.35" transform="rotate(-25 28 34)"/>
  <ellipse cx="92" cy="38" rx="9" ry="13" fill="#E8A0B0" opacity="0.28" transform="rotate(20 92 38)"/>
  <ellipse cx="24" cy="78" rx="8" ry="11" fill="#D4788A" opacity="0.18" transform="rotate(15 24 78)"/>
  <ellipse cx="96" cy="82" rx="9" ry="12" fill="#F2C4CE" opacity="0.22" transform="rotate(-18 96 82)"/>
  <!-- bouquet -->
  <g transform="translate(60 62)">
    <ellipse cx="0" cy="22" rx="18" ry="5.5" fill="#D8C8BC" opacity="0.35"/>
    <path d="M-10 20 Q-8 4 0 -16" stroke="url(#leaf)" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <path d="M0 22 Q1 2 10 -20" stroke="url(#leaf)" stroke-width="2.8" fill="none" stroke-linecap="round"/>
    <path d="M10 20 Q12 6 4 -8" stroke="url(#leaf)" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <circle cx="0" cy="-18" r="8.5" fill="url(#rose)"/>
    <circle cx="-7" cy="-13" r="6" fill="url(#roseLight)"/>
    <circle cx="7" cy="-13" r="6" fill="url(#roseLight)"/>
    <circle cx="11" cy="-22" r="7" fill="url(#rose)"/>
    <circle cx="-10" cy="-10" r="5" fill="#D4788A"/>
    <circle cx="0" cy="-18" r="2.2" fill="#FFF8F4" opacity="0.85"/>
    <!-- subtle person silhouette -->
    <circle cx="0" cy="10" r="13" fill="#C24E68" opacity="0.1"/>
    <circle cx="0" cy="-1" r="11" fill="#C24E68" opacity="0.08"/>
  </g>
</svg>
