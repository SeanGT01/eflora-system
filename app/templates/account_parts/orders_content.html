async function payCartStore(storeId) {
    if (!storeId) {
        showOrderToast('Store checkout is unavailable for this basket.');
        return;
    }

    try {
        if (typeof loadCart === 'function') {
            await loadCart();
        }

        if (!Array.isArray(cart) || !cart.length) {
            showOrderToast('Your basket is empty.');
            return;
        }

        const token = await getAuthToken();
        const storeIds = [...new Set(cart.map(item => item.store_id).filter(Boolean))];

        await Promise.all(storeIds.map(id =>
            fetch(`/api/v1/checkout/cart/store/${id}/toggle`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify({ selected: id === storeId })
            })
        ));

        cart.forEach(item => {
            item.is_selected = item.store_id === storeId;
        });

        if (typeof updateCartDisplay === 'function') updateCartDisplay();
        closeOrderDetail();
        checkout();
    } catch (error) {
        console.error('Pay cart store error:', error);
        showOrderToast('Could not start checkout for these items.');
        if (typeof loadCart === 'function') {
            await loadCart();
        }
    }
}

/* ═══════════════════════════════════════
   RATING MODAL (store first, then products)
═══════════════════════════════════════ */
let _ratingOrderId = null;
let _ratingState = {}; // { [order_item_id]: { rating: 0, comment: '' } }
let _ratingPhase = 'store'; // 'store' | 'products'
let _ratingOrderSnapshot = null;
let _ratingExistingRatings = {};
let _ratingExistingStore = null;
let _ratingUnratedItems = [];
let _storeRatingState = { rating: 0, comment: '' };
let _ratingAutoOpened = false;

function eligibleForRatingPrompt(order) {
    const st = order.status;
    if (st !== 'delivered' && st !== 'completed') return false;
    if (order.all_rated) return false;
    try {
        if (sessionStorage.getItem('ratingPromptDismissed_' + order.id)) return false;
    } catch (e) {}
    return true;
}

function maybeAutoOpenRatingModal() {
    const candidates = _allOrders.filter(eligibleForRatingPrompt);
    if (!candidates.length) return;
    candidates.sort((a, b) => {
        const da = new Date(a.created_at || 0).getTime();
        const db = new Date(b.created_at || 0).getTime();
        return da - db;
    });
    const pick = candidates[0];
    setTimeout(() => rateOrder(pick.id, true), 450);
}

function _itemHasProductRating(itemId) {
    const r = _ratingExistingRatings;
    return !!(r && (r[itemId] || r[String(itemId)]));
}

function updateRatingFooterChrome() {
    const skipBtn = document.getElementById('ratingSkipStoreBtn');
    const submitBtn = document.getElementById('ratingSubmitBtn');
    const title = document.getElementById('ratingModalTitle');
    if (!submitBtn) return;
    if (_ratingPhase === 'store') {
        if (skipBtn) {
            skipBtn.style.display = 'inline-flex';
            skipBtn.style.marginRight = 'auto';
        }
        submitBtn.textContent = 'Continue';
        if (title) title.textContent = 'Rate your experience';
    } else {
        if (skipBtn) {
            skipBtn.style.display = 'none';
            skipBtn.style.marginRight = '';
        }
        submitBtn.textContent = 'Submit ratings';
        if (title) title.textContent = 'Rate your products';
    }
}

function renderStoreRatingStep(orderRes) {
    const body = document.getElementById('ratingModalBody');
    const storeName = esc(orderRes.store_name || 'Store');
    const logo = orderRes.store_logo
        ? `<img src="${esc(orderRes.store_logo)}" alt="" style="width:56px;height:56px;border-radius:50%;object-fit:cover;border:1px solid var(--border);" onerror="this.style.display='none'">`
        : `<div class="rating-item-img-ph" style="width:56px;height:56px;border-radius:50%;"><i class="ri-store-2-line"></i></div>`;
    body.innerHTML = `
        <p style="margin:0 0 1rem;font-size:14px;color:var(--muted);line-height:1.45;">How was your overall experience with this shop? Stars are required to continue; you can add an optional comment.</p>
        <div class="rating-item-card" style="margin-bottom:0;">
            <div class="rating-item-header">
                ${logo}
                <div class="rating-item-info">
                    <div class="rating-item-name">${storeName}</div>
                    <div class="rating-item-variant">Order ${esc(orderRes.order_number || '#' + _ratingOrderId)}</div>
                </div>
            </div>
            <div class="rating-stars-row" id="ratingStoreStars" data-store-stars="1">
                ${[1,2,3,4,5].map(star => `<i class="ri-star-line rating-star" data-star="${star}" onclick="setStoreRating(${star})" onmouseenter="hoverStoreStars(${star})" onmouseleave="unhoverStoreStars()"></i>`).join('')}
            </div>
            <textarea class="rating-comment" id="ratingStoreComment" placeholder="Optional feedback about packaging, communication, or service" maxlength="500" oninput="_storeRatingState.comment = this.value">${esc(_storeRatingState.comment || '')}</textarea>
        </div>`;
    if (_storeRatingState.rating > 0) setStoreRating(_storeRatingState.rating);
    updateRatingFooterChrome();
    updateSubmitBtnState();
}

function renderProductRatingStep() {
    const body = document.getElementById('ratingModalBody');
    const unratedItems = _ratingUnratedItems || [];
    if (!unratedItems.length) {
        body.innerHTML = `<div style="text-align:center;padding:2rem;color:var(--muted);">No products left to rate.</div>`;
        updateRatingFooterChrome();
        updateSubmitBtnState();
        return;
    }
    _ratingState = {};
    unratedItems.forEach(item => {
        _ratingState[item.id] = { rating: 0, comment: '' };
    });
    body.innerHTML = `
        <div class="rating-items-list">
            ${unratedItems.map(item => {
                const name = item.name || item.product_name || 'Product';
                const variant = item.variant_name ? `<div class="rating-item-variant">${esc(item.variant_name)}</div>` : '';
                const img = item.image_url || item.product_image_url;
                const imgHtml = img
                    ? `<img class="rating-item-img" src="${img}" alt="${esc(name)}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
                       <div class="rating-item-img-ph" style="display:none;"><i class="ri-flower-line"></i></div>`
                    : `<div class="rating-item-img-ph"><i class="ri-flower-line"></i></div>`;
                return `
                    <div class="rating-item-card" data-item-id="${item.id}">
                        <div class="rating-item-header">
                            ${imgHtml}
                            <div class="rating-item-info">
                                <div class="rating-item-name">${esc(name)}</div>
                                ${variant}
                            </div>
                        </div>
                        <div class="rating-stars-row" data-item-id="${item.id}">
                            ${[1,2,3,4,5].map(star => `<i class="ri-star-line rating-star" data-star="${star}" data-item-id="${item.id}" onclick="setRating(${item.id}, ${star})" onmouseenter="hoverStars(${item.id}, ${star})" onmouseleave="unhoverStars(${item.id})"></i>`).join('')}
                        </div>
                        <textarea class="rating-comment" data-item-id="${item.id}" placeholder="Share your thoughts about this product (optional)" maxlength="500" oninput="_ratingState[${item.id}].comment = this.value"></textarea>
                    </div>`;
            }).join('')}
        </div>`;
    updateRatingFooterChrome();
    updateSubmitBtnState();
}

async function rateOrder(orderId, fromAuto) {
    _ratingAutoOpened = !!fromAuto;
    _ratingOrderId = orderId;
    _ratingState = {};
    _ratingPhase = 'store';
    _ratingOrderSnapshot = null;
    _ratingExistingRatings = {};
    _ratingExistingStore = null;
    _ratingUnratedItems = [];
    _storeRatingState = { rating: 0, comment: '' };

    // Fast path: local list already knows this order is fully rated
    const local = (_allOrders || []).find(o => Number(o.id) === Number(orderId));
    if (local && local.all_rated) {
        _ratingOrderId = null;
        _ratingAutoOpened = false;
        return;
    }

    const modal = document.getElementById('ratingModal');
    const body = document.getElementById('ratingModalBody');
    const submitBtn = document.getElementById('ratingSubmitBtn');
    if (!modal || !body || !submitBtn) return;
    submitBtn.disabled = true;

    // Load ratings before showing the modal so already-rated orders never flash open
    body.innerHTML = `<div style="text-align:center;padding:2rem;"><div class="loading-spinner" style="margin:0 auto;"></div></div>`;

    try {
        const [orderRes, ratingsRes] = await Promise.all([
            fetch(`/api/account/orders/${orderId}?_=${Date.now()}`, { cache: 'no-store' }).then(r => r.json()),
            fetch(`/api/account/orders/${orderId}/ratings?_=${Date.now()}`, { cache: 'no-store' }).then(r => r.json()),
        ]);

        const items = orderRes.items || [];
        if (!items.length) {
            _ratingOrderId = null;
            _ratingAutoOpened = false;
            return;
        }

        _ratingOrderSnapshot = orderRes;
        _ratingExistingRatings = ratingsRes.ratings || {};
        _ratingExistingStore = ratingsRes.store_rating || null;

        _ratingUnratedItems = items.filter(item => !_itemHasProductRating(item.id));

        const st = orderRes.status;
        const rateable = st === 'delivered' || st === 'completed';
        const needStore = rateable && !_ratingExistingStore;
        const needProducts = _ratingUnratedItems.length > 0;

        if (!needStore && !needProducts) {
            // Keep local list in sync so Rate button disappears
            const i = _allOrders.findIndex(o => Number(o.id) === Number(orderId));
            if (i >= 0) _allOrders[i].all_rated = true;
            refreshOrdersView();
            _ratingOrderId = null;
            _ratingAutoOpened = false;
            return;
        }

        modal.style.display = 'flex';
        modal.classList.add('active');

        if (needStore) {
            _ratingPhase = 'store';
            renderStoreRatingStep(orderRes);
        } else {
            _ratingPhase = 'products';
            renderProductRatingStep();
        }
    } catch (err) {
        modal.style.display = 'flex';
        modal.classList.add('active');
        body.innerHTML = `<div style="text-align:center;padding:2rem;color:var(--muted);">Failed to load order details.</div>`;
    }
}

function setStoreRating(star) {
    _storeRatingState.rating = star;
    const row = document.getElementById('ratingStoreStars');
    if (row) {
        row.querySelectorAll('.rating-star').forEach(el => {
            const s = parseInt(el.dataset.star, 10);
            el.classList.toggle('active', s <= star);
            el.className = el.className.replace(/ri-star-(fill|line)/, s <= star ? 'ri-star-fill' : 'ri-star-line');
        });
    }
    updateSubmitBtnState();
}

function hoverStoreStars(star) {
    const row = document.getElementById('ratingStoreStars');
    if (row) {
        row.querySelectorAll('.rating-star').forEach(el => {
            const s = parseInt(el.dataset.star, 10);
            el.classList.toggle('hovered', s <= star);
        });
    }
}

function unhoverStoreStars() {
    const row = document.getElementById('ratingStoreStars');
    if (row) {
        row.querySelectorAll('.rating-star').forEach(el => el.classList.remove('hovered'));
    }
}

function skipStoreRatingStep() {
    if (_ratingPhase !== 'store') return;
    _ratingPhase = 'products';
    if (!_ratingUnratedItems.length) {
        closeRatingModal();
        showOrderToast('You can rate the store later from this order.');
        return;
    }
    renderProductRatingStep();
}

async function submitStoreAndAdvance() {
    if (_storeRatingState.rating < 1) return;
    const btn = document.getElementById('ratingSubmitBtn');
    btn.disabled = true;
    btn.textContent = 'Saving…';
    const comment = (_storeRatingState.comment || '').trim();
    try {
        const res = await fetch(`/api/account/orders/${_ratingOrderId}/rate`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                store_rating: {
                    rating: _storeRatingState.rating,
                    comment: comment || null,
                },
            }),
        });
        const data = await res.json();
        if (!data.success) {
            showOrderToast(data.error || 'Could not save store rating.');
            btn.disabled = false;
            btn.textContent = 'Continue';
            return;
        }
        _ratingExistingStore = { rating: _storeRatingState.rating };
        if (!_ratingUnratedItems.length) {
            showOrderToast('Thank you for rating this shop!');
            await loadOrders();
            refreshOrdersView();
            closeRatingModal();
            return;
        }
        _ratingPhase = 'products';
        btn.textContent = 'Submit ratings';
        renderProductRatingStep();
    } catch {
        showOrderToast('Error saving store rating.');
        btn.disabled = false;
        btn.textContent = 'Continue';
    }
}

function ratingPrimaryAction() {
    if (_ratingPhase === 'store') submitStoreAndAdvance();
    else submitRatings();
}

function setRating(itemId, star) {
    _ratingState[itemId].rating = star;
    const row = document.querySelector(`.rating-stars-row[data-item-id="${itemId}"]`);
    if (row) {
        row.querySelectorAll('.rating-star').forEach(el => {
            const s = parseInt(el.dataset.star);
            el.classList.toggle('active', s <= star);
            el.className = el.className.replace(/ri-star-(fill|line)/, s <= star ? 'ri-star-fill' : 'ri-star-line');
        });
    }
    updateSubmitBtnState();
}

function hoverStars(itemId, star) {
    const row = document.querySelector(`.rating-stars-row[data-item-id="${itemId}"]`);
    if (row) {
        row.querySelectorAll('.rating-star').forEach(el => {
            const s = parseInt(el.dataset.star);
            el.classList.toggle('hovered', s <= star);
        });
    }
}

function unhoverStars(itemId) {
    const row = document.querySelector(`.rating-stars-row[data-item-id="${itemId}"]`);
    if (row) {
        row.querySelectorAll('.rating-star').forEach(el => {
            el.classList.remove('hovered');
        });
    }
}

function updateSubmitBtnState() {
    const btn = document.getElementById('ratingSubmitBtn');
    if (!btn) return;
    if (_ratingPhase === 'store') {
        btn.disabled = _storeRatingState.rating < 1;
    } else {
        const hasAtLeastOne = Object.values(_ratingState).some(r => r.rating > 0);
        btn.disabled = !hasAtLeastOne;
    }
}

async function submitRatings() {
    const btn = document.getElementById('ratingSubmitBtn');
    btn.disabled = true;
    btn.textContent = 'Submitting…';

    const ratings = Object.entries(_ratingState)
        .filter(([_, r]) => r.rating > 0)
        .map(([itemId, r]) => ({
            order_item_id: parseInt(itemId, 10),
            rating: r.rating,
            comment: (r.comment && String(r.comment).trim()) ? String(r.comment).trim() : null,
        }));

    try {
        const res = await fetch(`/api/account/orders/${_ratingOrderId}/rate`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ratings }),
        });
        const data = await res.json();

        if (data.success) {
            showOrderToast('Thank you for your rating!');
            await loadOrders();
            refreshOrdersView();
            closeRatingModal();
            // Keep Rate visible when products/store remain unrated (partial submit).
            // refreshOrdersView already shows/hides via order.all_rated.
            queueMicrotask(() => maybeAutoOpenRatingModal());
        } else {
            showOrderToast(data.error || 'Failed to submit rating.');
            btn.disabled = false;
            btn.textContent = 'Submit ratings';
        }
    } catch {
        showOrderToast('Error submitting rating.');
        btn.disabled = false;
        btn.textContent = 'Submit ratings';
    }
}

function closeRatingModal() {
    const modal = document.getElementById('ratingModal');
    if (_ratingAutoOpened && _ratingOrderId) {
        try {
            sessionStorage.setItem('ratingPromptDismissed_' + _ratingOrderId, '1');
        } catch (e) {}
    }
    modal.classList.remove('active');
    setTimeout(() => { modal.style.display = 'none'; }, 300);
    _ratingOrderId = null;
    _ratingState = {};
    _ratingPhase = 'store';
    _ratingOrderSnapshot = null;
    _ratingExistingRatings = {};
    _ratingExistingStore = null;
    _ratingUnratedItems = [];
    _storeRatingState = { rating: 0, comment: '' };
    _ratingAutoOpened = false;
}

async function reorderItems(orderId) {
    showOrderToast('Adding items to cart…');
    try {
        const res = await fetch(`/api/account/orders/${orderId}`);
        const order = await res.json();
        const items = order.items || [];

        if (!items.length) {
            showOrderToast('No items found in this order.');
            return;
        }

        let added = 0;
        let skipped = 0;

        for (const item of items) {
            try {
                const payload = {
                    product_id: item.product_id,
                    quantity: 1,
                };
                if (item.variant_id) {
                    payload.variant_id = item.variant_id;
                }
                const addons = Array.isArray(item.addons) ? item.addons : [];
                const productQty = Math.max(1, Number(item.quantity) || 1);
                const addonOptionIds = [];
                for (const a of addons) {
                    const optionId = Number(a && a.addon_option_id);
                    if (!Number.isFinite(optionId) || optionId <= 0) continue;
                    // Scale addon units back to a single product qty=1 reorder.
                    const lineUnits = Math.max(1, Number(a.quantity) || 1);
                    const perProduct = Math.max(1, Math.round(lineUnits / productQty));
                    addonOptionIds.push({
                        addon_option_id: optionId,
                        quantity: perProduct,
                    });
                }
                if (addonOptionIds.length) {
                    payload.addon_option_ids = addonOptionIds;
                }
                const r = await fetch('/api/cart/items', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });
                const d = await r.json();
                if (r.ok && !d.error) {
                    added++;
                } else {
                    skipped++;
                }
            } catch {
                skipped++;
            }
        }

        if (added > 0) {
            showOrderToast(`${added} item${added !== 1 ? 's' : ''} added to cart${skipped > 0 ? ` (${skipped} out of stock)` : ''}`);
            // Reload cart groups and re-render
            await loadCartGroups();
            applyFilters();
        } else {
            showOrderToast('All items are out of stock.');
        }
    } catch {
        showOrderToast('Failed to reorder. Please try again.');
    }
}

/* ═══════════════════════════════════════
   UTILITIES
═══════════════════════════════════════ */
function formatPeso(v) {
    return '₱' + parseFloat(v || 0).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function orderItemLineTotal(item) {
    if (item == null) return 0;
    if (item.total != null && item.total !== '') return Number(item.total) || 0;
    const qty = Number(item.quantity || 0);
    const price = Number(item.price || 0);
    const addons = Array.isArray(item.addons) ? item.addons : [];
    const addonsTotal = Number(item.addons_total != null
        ? item.addons_total
        : addons.reduce((s, a) => s + Number(a.total != null ? a.total : (Number(a.price || 0) * Number(a.quantity || 1))), 0));
    return (qty * price) + addonsTotal;
}

function orderItemPriceBreakdownHtml(item, compact) {
    if (!item) return '';
    const addons = Array.isArray(item.addons) ? item.addons : [];

    // Order cards: names only — no priced breakdown.
    if (compact) {
        if (!addons.length) return '';
        return `<div style="margin-top:4px;display:flex;flex-direction:column;gap:3px;">
            ${addons.map(a => {
                const aName = a.name || 'Add-on';
                const aQty = Math.max(1, Number(a.quantity || 1));
                return `<div style="font-size:10px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">
                    + ${esc(aName)}${aQty > 1 ? ` ×${aQty}` : ''}
                </div>`;
            }).join('')}
        </div>`;
    }

    const qty = Math.max(1, Number(item.quantity || 1));
    const unitPrice = Number(item.price || 0);
    const productSub = unitPrice * qty;
    const productName = String(item.name || item.product_name || 'Product').trim() || 'Product';
    const variantName = item.variant_name ? String(item.variant_name).trim() : '';

    const mainLabel = variantName
        ? `${productName} · ${variantName}`
        : productName;

    const mainRow = `
        <div class="oi-bd-row">
            <span class="oi-bd-label oi-bd-label--main">${esc(mainLabel)}</span>
            <span class="oi-bd-calc">${formatPeso(unitPrice)} × ${qty}</span>
            <span class="oi-bd-amt">${formatPeso(productSub)}</span>
        </div>`;

    const addonRows = addons.map(a => {
        const aName = a.name || 'Add-on';
        const aQty = Math.max(1, Number(a.quantity || 1));
        const aUnit = Number(a.price || 0);
        const aTotal = Number(a.total != null ? a.total : (aUnit * aQty));
        const aImg = a.image_url
            ? `<img class="oi-bd-thumb" src="${esc(a.image_url)}" alt="">`
            : '';
        return `
            <div class="oi-bd-row">
                <span class="oi-bd-label">${aImg}+ ${esc(aName)}${aQty > 1 ? ` ×${aQty}` : ''}</span>
                <span class="oi-bd-calc">${formatPeso(aUnit)} × ${aQty}</span>
                <span class="oi-bd-amt">${formatPeso(aTotal)}</span>
            </div>`;
    }).join('');

    return `<div class="order-item-breakdown">${mainRow}${addonRows}</div>`;
}

function orderItemAddonsHtml(item, compact) {
    return orderItemPriceBreakdownHtml(item, compact);
}

function parseApiDateTime(value) {
    if (!value) return null;
    const raw = String(value).trim();
    if (!raw) return null;
    // Backend often sends UTC without suffix; treat as UTC for consistent PH conversion.
    if (/^\d{4}-\d{2}-\d{2}$/.test(raw)) return new Date(`${raw}T00:00:00Z`);
    if (/[zZ]|[+\-]\d{2}:\d{2}$/.test(raw)) return new Date(raw);
    return new Date(`${raw}Z`);
}

function formatDatePH(dt) {
    if (!dt) return '—';
    try {
        const parsed = parseApiDateTime(dt);
        if (!parsed || Number.isNaN(parsed.getTime())) return String(dt);
        return new Intl.DateTimeFormat('en-PH', {
            year: 'numeric',
            month: 'short',
            day: 'numeric',
            timeZone: 'Asia/Manila'
        }).format(parsed);
    } catch {
        return String(dt);
    }
}

function formatDateTimePH(dt) {
    if (!dt) return '—';
    try {
        const parsed = parseApiDateTime(dt);
        if (!parsed || Number.isNaN(parsed.getTime())) return String(dt);
        return new Intl.DateTimeFormat('en-PH', {
            year: 'numeric',
            month: 'short',
            day: 'numeric',
            hour: 'numeric',
            minute: '2-digit',
            hour12: true,
            timeZone: 'Asia/Manila'
        }).format(parsed);
    } catch {
        return String(dt);
    }
}

function formatDate(dt) {
    return formatDatePH(dt);
}

function formatDateWithTime(dt) {
    return formatDateTimePH(dt);
}

function formatDeliveryTimeSlot(slot) {
    if (!slot) return 'Not specified';
    const raw = String(slot).trim();
    const m = raw.match(/^(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})$/);
    if (!m) return raw.toUpperCase().includes('AM') || raw.toUpperCase().includes('PM') ? raw : raw;
    const to12 = (h, min) => {
        const hr = Number(h);
        const suffix = hr >= 12 ? 'PM' : 'AM';
        const outH = (hr % 12) || 12;
        return `${outH}:${String(min).padStart(2, '0')} ${suffix}`;
    };
    return `${to12(m[1], m[2])} - ${to12(m[3], m[4])}`;
}

function capitalise(s) {
    return s ? s.charAt(0).toUpperCase() + s.slice(1).replace(/_/g, ' ') : '';
}

function formatPaymentMethod(method) {
    const normalized = String(method || '').trim().toLowerCase();
    if (!normalized || normalized === 'gcash') return 'GCash';
    if (normalized === 'cod') return 'COD';
    if (normalized === 'cash') return 'Cash';
    return capitalise(normalized);
}

function getDisplayState(order) {
    const status = order.status || 'pending';
    const paymentStatus = order.payment_status || 'pending';
    const paymentMethod = String(order.payment_method || '').trim().toLowerCase();
    const isCod = paymentMethod === 'cod' || paymentStatus === 'cod_pending' || paymentStatus === 'cod_approved';

    if (status === 'cancelled') {
        return { key: 'cancelled', label: 'Cancelled', progressKey: 'cancelled' };
    }
    if (status === 'delivered') {
        return { key: 'delivered', label: 'Delivered', progressKey: 'delivered' };
    }
    if (status === 'completed') {
        return { key: 'completed', label: 'Completed', progressKey: 'delivered' };
    }
    if (status === 'on_delivery') {
        return { key: 'on_delivery', label: 'In Transit', progressKey: 'on_delivery' };
    }
    if (status === 'done_preparing') {
        return { key: 'processing', label: 'Ready', progressKey: 'done_preparing' };
    }

    // COD: no online payment step — show under To Ship while awaiting seller / preparing.
    if (isCod && (status === 'pending' || paymentStatus === 'cod_pending')) {
        return { key: 'processing', label: 'Awaiting Confirmation', progressKey: 'pending' };
    }
    if (isCod && (paymentStatus === 'cod_approved' || status === 'accepted' || status === 'preparing')) {
        return { key: 'processing', label: 'Preparing', progressKey: 'processing' };
    }

    // Receipt uploaded but still waiting for seller/admin review.
    if (paymentStatus === 'pending_verification') {
        return { key: 'processing', label: 'Under Review', progressKey: 'pending' };
    }

    if (status === 'accepted' || status === 'preparing' || paymentStatus === 'verified') {
        return { key: 'processing', label: 'Preparing', progressKey: 'processing' };
    }

    return { key: 'pending', label: 'To Pay', progressKey: 'pending' };
}

function esc(s) {
    if (!s) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function showOrderToast(msg) {
    if (typeof showToast === 'function') { showToast(msg); return; }
    const t = document.createElement('div');
    t.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--charcoal);color:white;padding:12px 24px;border-radius:50px;font-size:14px;z-index:9999;';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 3000);
}
