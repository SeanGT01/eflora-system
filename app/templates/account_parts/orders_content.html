<!-- account_parts/orders_content.html -->
<style>
{% include 'partials/order_detail_sdm_styles.html' %}
/* ── Orders Page ── */
.orders-page { 
    padding: clamp(0.75rem, 1.5vw, 1rem); 
    max-width: 1000px;
    margin: 0 auto;
}

.orders-page-title {
    font-family: var(--font-display);
    font-size: clamp(20px, 3vw, 24px);
    font-weight: 400;
    color: var(--charcoal);
    margin-bottom: clamp(1rem, 2vw, 1.25rem);
    line-height: 1.2;
    letter-spacing: -0.5px;
}

.orders-page-header {
    display: block;
}

.orders-status-dropdown {
    display: none;
}

/* ── Status Tab Bar ── */
.order-tabs {
    display: flex;
    gap: 0.35rem;
    border-bottom: 1px solid var(--border);
    margin-bottom: 1.5rem;
    overflow-x: auto;
    scrollbar-width: none;
    padding-bottom: 0.35rem;
}
.order-tabs::-webkit-scrollbar { display: none; }

.order-tab {
    padding: clamp(0.5rem, 1.5vw, 0.65rem) clamp(0.75rem, 2vw, 1rem);
    font-size: clamp(12px, 2vw, 13px);
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    border: 1px solid transparent;
    background: rgba(255, 255, 255, 0.35);
    font-family: var(--font-sans);
    white-space: nowrap;
    position: relative;
    transition: all 0.3s ease;
    border-radius: var(--radius-pill);
    margin-bottom: 0;
}
.order-tab:hover { 
    color: var(--deep-rose);
    background: rgba(255, 255, 255, 0.6);
    border-color: rgba(255, 255, 255, 0.7);
}
.order-tab.active {
    color: #fff;
    border-color: transparent;
    background: linear-gradient(135deg, #c24e68 0%, #d878a0 55%, #b070c8 100%);
    font-weight: 700;
    box-shadow: 0 6px 16px rgba(181, 68, 90, 0.22);
}

.tab-count {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 18px;
    height: 18px;
    background: rgba(194, 78, 104, 0.85);
    color: white;
    border-radius: 50px;
    font-size: 10px;
    font-weight: 700;
    margin-left: 6px;
    padding: 0 5px;
}

.order-tab.active .tab-count {
    background: rgba(255, 255, 255, 0.3);
}

/* ── Search Bar ── */
.orders-search-bar {
    position: relative;
    margin-bottom: 1.25rem;
}
.orders-search-bar i {
    position: absolute;
    left: clamp(0.75rem, 2vw, 1rem);
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: clamp(14px, 3vw, 16px);
}
.orders-search-bar input {
    width: 100%;
    padding: clamp(0.6rem, 2vw, 0.7rem) clamp(0.75rem, 2vw, 1rem) clamp(0.6rem, 2vw, 0.7rem) clamp(2.5rem, 8vw, 2.75rem);
    background: rgba(255, 255, 255, 0.55);
    border: 1.5px solid rgba(255, 255, 255, 0.7);
    border-radius: var(--radius-pill);
    font-family: var(--font-sans);
    font-size: clamp(12px, 2.5vw, 13px);
    color: var(--charcoal);
    outline: none;
    transition: var(--transition);
    box-shadow:
        0 8px 24px rgba(80, 40, 70, 0.06),
        inset 0 1px 0 rgba(255, 255, 255, 0.75);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
}
.orders-search-bar input:focus {
    border-color: rgba(216, 120, 160, 0.55);
    background: rgba(255, 255, 255, 0.78);
    box-shadow: 0 0 0 3px rgba(194, 78, 104, 0.1);
}
.orders-search-bar input::placeholder {
    color: var(--muted);
    opacity: 0.7;
}

/* ── Order Card ── */
.order-card {
    background:
        radial-gradient(ellipse 80% 60% at 0% 0%, rgba(255, 190, 210, 0.22) 0%, transparent 55%),
        radial-gradient(ellipse 70% 50% at 100% 100%, rgba(210, 190, 240, 0.2) 0%, transparent 50%),
        rgba(255, 255, 255, 0.55);
    border-radius: var(--radius-xl);
    border: 1px solid rgba(255, 255, 255, 0.7);
    margin-bottom: clamp(0.85rem, 1.4vw, 1rem);
    overflow: hidden;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow:
        0 8px 24px rgba(80, 40, 70, 0.06),
        inset 0 1px 0 rgba(255, 255, 255, 0.75);
    backdrop-filter: blur(14px) saturate(1.25);
    -webkit-backdrop-filter: blur(14px) saturate(1.25);
    position: relative;
}
.order-card:hover {
    border-color: rgba(230, 170, 195, 0.55);
    box-shadow:
        0 16px 36px rgba(80, 40, 70, 0.1),
        inset 0 1px 0 rgba(255, 255, 255, 0.85);
    background:
        radial-gradient(ellipse 80% 60% at 0% 0%, rgba(255, 190, 210, 0.28) 0%, transparent 55%),
        radial-gradient(ellipse 70% 50% at 100% 100%, rgba(210, 190, 240, 0.26) 0%, transparent 50%),
        rgba(255, 255, 255, 0.72);
    transform: translateY(-2px);
}

/* Store header */
.order-card-store-hdr {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: clamp(0.65rem, 1.2vw, 0.85rem) clamp(0.85rem, 1.5vw, 1rem);
    border-bottom: 1px solid rgba(230, 170, 195, 0.25);
    background:
        radial-gradient(ellipse 70% 120% at 0% 50%, rgba(255, 190, 210, 0.18) 0%, transparent 60%),
        rgba(255, 255, 255, 0.4);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    gap: 0.65rem;
    flex-wrap: wrap;
}
.order-store-left {
    display: flex;
    align-items: center;
    gap: 0.5rem;
}
.order-store-icon {
    width: clamp(24px, 5vw, 28px);
    height: clamp(24px, 5vw, 28px);
    border-radius: 50%;
    background: linear-gradient(135deg, #c24e68 0%, #d878a0 55%, #b070c8 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(11px, 2.5vw, 13px);
    color: white;
    flex-shrink: 0;
}
.order-store-name {
    font-size: clamp(12px, 2vw, 13px);
    font-weight: 700;
    color: var(--charcoal);
    word-break: break-word;
}
.order-status-badge {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.03em;
    padding: clamp(5px, 1.5vw, 7px) clamp(10px, 2.5vw, 12px);
    border-radius: var(--radius-pill);
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    border: 1px solid transparent;
}
.badge-pending      { background: rgba(255, 210, 180, 0.45); color: #a06030; border-color: rgba(232, 160, 120, 0.4); }
.badge-processing   { background: rgba(210, 190, 240, 0.4); color: #6a4a9a; border-color: rgba(176, 112, 200, 0.35); }
.badge-preparing    { background: rgba(210, 190, 240, 0.4); color: #6a4a9a; border-color: rgba(176, 112, 200, 0.35); }
.badge-done_preparing { background: rgba(200, 230, 210, 0.5); color: #3f6b4e; border-color: rgba(122, 158, 126, 0.35); }
.badge-on_delivery  { background: rgba(255, 190, 210, 0.4); color: #a04060; border-color: rgba(194, 78, 104, 0.3); }
.badge-delivered    { background: rgba(200, 230, 210, 0.5); color: #3f6b4e; border-color: rgba(122, 158, 126, 0.35); }
.badge-completed    { background: rgba(216, 120, 160, 0.18); color: #a04068; border-color: rgba(194, 78, 104, 0.28); }
.badge-cancelled    { background: rgba(194, 78, 104, 0.12); color: #9b1c1c; border-color: rgba(194, 78, 104, 0.25); }

/* Items list */
.order-items-list {
    padding: clamp(0.7rem, 1.1vw, 0.85rem) clamp(0.85rem, 1.5vw, 1rem);
}
.order-item-row {
    display: flex;
    gap: clamp(0.5rem, 1vw, 0.625rem);
    align-items: flex-start;
    padding: clamp(0.6rem, 1.2vw, 0.75rem);
    border-bottom: 1px solid rgba(230, 170, 195, 0.2);
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.45);
    margin-bottom: 0.4rem;
}
.order-item-row:last-child { border-bottom: none; margin-bottom: 0; }

.order-item-img {
    width: 55px;
    height: 55px;
    border-radius: var(--radius-md);
    object-fit: cover;
    background:
        radial-gradient(ellipse at 30% 30%, #f8d0dc, transparent 60%),
        radial-gradient(ellipse at 80% 80%, #e8d8f4, #f5ebe8);
    flex-shrink: 0;
}
.order-item-img-ph {
    width: 55px;
    height: 55px;
    border-radius: var(--radius-md);
    background:
        radial-gradient(ellipse at 30% 30%, #f8d0dc, transparent 60%),
        radial-gradient(ellipse at 80% 80%, #e8d8f4, #f5ebe8);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    color: rgba(194, 78, 104, 0.35);
    flex-shrink: 0;
}

.order-item-info { 
    flex: 1; 
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
}

.order-item-name-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 0.5rem;
    min-width: 0;
}

.order-item-name {
    font-size: clamp(11px, 1.8vw, 12px);
    font-weight: 600;
    color: var(--charcoal);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    line-height: 1.3;
    min-width: 0;
    flex: 1;
}

.order-item-rating {
    display: inline-flex;
    align-items: center;
    gap: 1px;
    flex-shrink: 0;
    line-height: 1;
    color: #f0b429;
    font-size: 12px;
    margin-top: 1px;
}
.order-item-rating i { line-height: 1; }
.order-item-rating .ri-star-line {
    color: rgba(44, 37, 32, 0.22);
}

.order-item-variant {
    font-size: clamp(11px, 2vw, 12px);
    color: var(--deep-rose);
    font-weight: 500;
}

.order-item-qty {
    font-size: clamp(11px, 2vw, 12px);
    color: var(--muted);
}

.order-item-price {
    font-family: var(--font-display);
    font-size: clamp(13px, 2.7vw, 16px);
    font-weight: 600;
    color: var(--deep-rose);
    white-space: nowrap;
    flex-shrink: 0;
    align-self: flex-start;
    margin-top: 0.3rem;
}

/* Per-item price breakdown (main / variant / add-ons) */
.order-item-breakdown {
    margin-top: 6px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding-top: 6px;
    border-top: 1px dashed rgba(44, 37, 32, 0.1);
}
.order-item-breakdown--compact {
    margin-top: 4px;
    padding-top: 0;
    border-top: none;
    gap: 3px;
}
.oi-bd-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto auto;
    gap: 6px 8px;
    align-items: baseline;
    font-size: 11px;
    color: var(--muted);
    line-height: 1.35;
}
.order-item-breakdown--compact .oi-bd-row {
    font-size: 10px;
    grid-template-columns: minmax(0, 1fr) auto;
}
.order-item-breakdown--compact .oi-bd-calc {
    display: none;
}
.oi-bd-label {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.oi-bd-label--main {
    color: var(--charcoal);
    font-weight: 500;
}
.oi-bd-calc {
    white-space: nowrap;
    color: rgba(44, 37, 32, 0.45);
    font-variant-numeric: tabular-nums;
}
.oi-bd-amt {
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    color: var(--charcoal);
    font-weight: 500;
    text-align: right;
}
.oi-bd-thumb {
    width: 18px;
    height: 18px;
    object-fit: cover;
    border-radius: 4px;
    border: 1px solid rgba(107, 76, 59, 0.12);
    flex-shrink: 0;
    vertical-align: middle;
    margin-right: 4px;
}

/* Footer */
.order-card-footer {
    padding: clamp(0.75rem, 1.2vw, 0.9rem) clamp(0.85rem, 1.5vw, 1rem);
    border-top: 1px solid rgba(230, 170, 195, 0.25);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: clamp(0.5rem, 1vw, 0.625rem);
    background:
        radial-gradient(ellipse 70% 120% at 100% 50%, rgba(210, 190, 240, 0.16) 0%, transparent 60%),
        rgba(255, 255, 255, 0.4);
}
.order-total-block {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
}
.order-total-label {
    font-size: 10px;
    color: var(--muted);
    font-weight: 500;
    margin-bottom: 1px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
}
.order-total-amount {
    font-family: var(--font-display);
    font-size: 19px;
    font-weight: 700;
    color: var(--deep-rose);
}
.order-total-items {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
}

.order-card-actions {
    display: flex;
    gap: 0.75rem;
    flex-wrap: wrap;
    justify-content: flex-end;
    align-items: center;
}

.btn-order-action {
    padding: clamp(0.42rem, 0.8vw, 0.52rem) clamp(0.85rem, 1.6vw, 1rem);
    border-radius: 999px;
    font-size: clamp(10px, 1.65vw, 11px);
    font-weight: 600;
    font-family: var(--font-sans);
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    border: 1px solid rgba(255, 255, 255, 0.7);
    background: rgba(255, 255, 255, 0.55);
    color: var(--charcoal);
    white-space: nowrap;
    min-height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.3rem;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
}
.btn-order-action:hover {
    border-color: rgba(216, 120, 160, 0.45);
    background: rgba(255, 232, 240, 0.65);
    color: var(--deep-rose);
    transform: translateY(-1px);
    box-shadow: 0 8px 18px rgba(80, 40, 70, 0.08);
}
.btn-order-action.primary {
    background: linear-gradient(135deg, #c24e68 0%, #d878a0 55%, #b070c8 100%);
    border-color: transparent;
    color: white;
}
.btn-order-action.primary:hover {
    background: linear-gradient(135deg, #b5445a 0%, #c86a90 55%, #a060b8 100%);
    border-color: transparent;
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(181, 68, 90, 0.3);
}
.btn-order-action.danger {
    color: #c62828;
    border-color: rgba(198,40,40,0.3);
}
.btn-order-action.danger:hover {
    background: #c62828;
    border-color: #c62828;
    color: white;
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(198,40,40,0.2);
}

/* Order meta (date / order #) */
.order-meta-row {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 0.6rem 1rem;
    background: rgba(255, 255, 255, 0.3);
    border-bottom: 1px solid var(--border);
    font-size: 11.5px;
    color: var(--muted);
}
.order-meta-row span { display: flex; align-items: center; gap: 4px; }
.order-meta-row i { font-size: 13px; }

/* Collapsed items */
.order-more-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: rgba(255, 255, 255, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.7);
    border-radius: var(--radius-pill);
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    padding: 3px 10px;
    margin-top: 6px;
    cursor: pointer;
    transition: var(--transition);
}
.order-more-badge:hover { border-color: rgba(216, 120, 160, 0.45); color: var(--deep-rose); }

/* ── Empty / Loading ── */
.orders-empty {
    text-align: center;
    padding: clamp(2rem, 5vw, 3rem) clamp(1.25rem, 2.5vw, 1.5rem);
    color: var(--muted);
}

.orders-empty-icon {
    font-size: clamp(40px, 12vw, 60px);
    opacity: 0.08;
    margin-bottom: clamp(1rem, 2vw, 1.25rem);
    display: block;
}

.orders-empty-title {
    font-family: var(--font-display);
    font-size: clamp(18px, 4vw, 22px);
    font-weight: 400;
    margin-bottom: clamp(0.4rem, 0.8vw, 0.5rem);
    color: var(--charcoal);
    line-height: 1.3;
    letter-spacing: -0.3px;
}

.orders-empty-sub {
    font-size: clamp(12px, 2.5vw, 13px);
    opacity: 0.65;
    margin-bottom: clamp(1rem, 2vw, 1.25rem);
    line-height: 1.5;
    max-width: 480px;
    margin-left: auto;
    margin-right: auto;
}

.orders-skeleton {
    display: flex;
    flex-direction: column;
    gap: 1rem;
}
.skeleton-card {
    background: rgba(255, 255, 255, 0.55);
    border-radius: var(--radius-lg);
    border: 1px solid rgba(255, 255, 255, 0.7);
    padding: 1.25rem;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 8px 24px rgba(80, 40, 70, 0.06);
}
.skeleton-line {
    height: 12px;
    background: linear-gradient(90deg, var(--cream) 25%, rgba(245,237,230,0.5) 50%, var(--cream) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    border-radius: 6px;
}
.skeleton-line.short  { width: 40%; }
.skeleton-line.medium { width: 65%; }
.skeleton-line.long   { width: 90%; }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

/* Progress tracker */
.order-progress {
    display: flex;
    align-items: center;
    gap: 0;
    margin: 1.5rem 0;
    position: relative;
}
.progress-step {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 1;
    position: relative;
    z-index: 1;
}
.progress-step-dot {
    width: clamp(28px, 6vw, 32px);
    height: clamp(28px, 6vw, 32px);
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.55);
    border: 2px solid rgba(255, 255, 255, 0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(12px, 2.5vw, 14px);
    color: var(--muted);
    margin-bottom: clamp(4px, 1vw, 6px);
    transition: var(--transition);
}
.progress-step.done .progress-step-dot {
    background: linear-gradient(135deg, #c24e68 0%, #d878a0 55%, #b070c8 100%);
    border-color: transparent;
    color: white;
}
.progress-step.active .progress-step-dot {
    background: rgba(255, 255, 255, 0.85);
    border-color: #c24e68;
    color: var(--deep-rose);
    box-shadow: 0 0 0 4px rgba(194, 78, 104, 0.12);
}
.progress-step-label {
    font-size: clamp(8px, 2vw, 10px);
    font-weight: 600;
    color: var(--muted);
    text-align: center;
    letter-spacing: 0.04em;
    line-height: 1.2;
}
.progress-step.done .progress-step-label,
.progress-step.active .progress-step-label { color: var(--charcoal); }

.progress-connector {
    flex: 1;
    height: 2px;
    background: var(--border);
    margin-bottom: clamp(18px, 4vw, 22px);
    position: relative;
    z-index: 0;
}
.progress-connector.done { background: linear-gradient(90deg, #c24e68, #d878a0); }

@media (max-width: 479px) {
    .orders-page { 
        padding: 0.75rem; 
    }
    
    .orders-page-title { 
        font-size: clamp(18px, 5vw, 24px); 
        margin-bottom: 1.25rem;
        font-weight: 400;
        line-height: 1.2;
    }
    
    .order-tabs {
        gap: 0.35rem;
        margin-bottom: 1.25rem;
        padding: 0 0 0.35rem;
        border-bottom: 1px solid var(--border);
    }
    
    .order-tab {
        padding: 0.65rem 0.85rem;
        font-size: 11px;
        font-weight: 600;
        flex-shrink: 0;
        white-space: nowrap;
    }
    
    .tab-count { 
        font-size: 9px; 
        min-width: 16px;
        height: 16px;
        padding: 0 4px;
        margin-left: 4px;
    }
    
    .orders-search-bar { 
        margin-bottom: 1.25rem;
    }
    
    .orders-search-bar i {
        left: 0.875rem;
        font-size: 16px;
    }
    
    .orders-search-bar input { 
        padding: 0.65rem 0.875rem 0.65rem 2.4rem; 
        font-size: 12px;
        border-radius: var(--radius-pill);
    }
    
    .order-card { 
        margin-bottom: 1rem;
        border-radius: var(--radius-lg);
    }
    
    .order-card-store-hdr {
        padding: 0.8rem 0.9rem;
        gap: 0.5rem;
    }
    
    .order-store-left { 
        gap: 0.5rem;
    }
    
    .order-store-icon { 
        width: 26px; 
        height: 26px; 
        font-size: 12px;
    }
    
    .order-store-name { 
        font-size: 13px;
        font-weight: 600;
    }
    
    .order-status-badge {
        font-size: 10px;
        padding: 4px 8px;
        font-weight: 700;
        white-space: nowrap;
        flex-shrink: 0;
    }
    
    .order-meta-row {
        gap: 0.625rem;
        padding: 0.55rem 0.9rem;
        font-size: 11px;
        flex-wrap: wrap;

/* Mobile: compact status dropdown + bottom sheet (desktop tabs unchanged) */

        align-items: center;
        justify-content: flex-end;
        gap: 0.75rem;
        margin-bottom: 0.85rem;
    }

        display: none !important;
    }
    .orders-status-dropdown {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        flex-shrink: 0;
        max-width: min(58%, 220px);
        min-height: 40px;

        background: rgba(255, 252, 248, 0.92);
        border: 1.5px solid rgba(194, 78, 104, 0.28);
        border-radius: 999px;

        white-space: nowrap;
    }

}

}
.orders-status-sheet-handle {

    min-height: 48px;

.orders-status-sheet-ico {
    width: 22px;
    font-size: 18px;
    color: var(--muted);
    flex-shrink: 0;
}
.orders-status-sheet-row.is-active .orders-status-sheet-ico {
    color: var(--deep-rose);
}
.orders-status-sheet-label {
    flex: 1;
    min-width: 0;
}
.orders-status-sheet-count {

/* ── Rating Modal ── */
.rating-modal {
    max-width: 560px;
    width: 95%;
    max-height: 90vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-sizing: border-box;
}
.rating-modal .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    flex-shrink: 0;
    padding: clamp(0.85rem, 2vw, 1.15rem) clamp(1rem, 3vw, 1.5rem);
}
.rating-modal .modal-header h3 {
    font-family: var(--font-display);
    font-size: clamp(17px, 4.2vw, 20px);
    font-weight: 500;
    margin: 0;
    line-height: 1.25;
    min-width: 0;
}
.rating-modal .modal-body {
    padding: clamp(0.85rem, 2.5vw, 1.35rem) clamp(1rem, 3vw, 1.5rem);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    flex: 1 1 auto;
    min-height: 0;
    max-height: none;
}
.rating-items-list {
    display: flex;
    flex-direction: column;
    gap: clamp(0.85rem, 2vw, 1.25rem);
}
.rating-item-card {
    background: rgba(255, 255, 255, 0.55);
    border-radius: 12px;
    padding: clamp(0.75rem, 2vw, 1rem);
    border: 1px solid rgba(255, 255, 255, 0.7);
    box-shadow: 0 8px 24px rgba(80, 40, 70, 0.06);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
}
.rating-item-header {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 0.75rem;
}
.rating-item-img {
    width: clamp(40px, 10vw, 48px);
    height: clamp(40px, 10vw, 48px);
    border-radius: 8px;
    object-fit: cover;
    background: var(--warm-white);
    flex-shrink: 0;
}
.rating-item-img-ph {
    width: clamp(40px, 10vw, 48px);
    height: clamp(40px, 10vw, 48px);
    border-radius: 8px;
    background: var(--warm-white);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    color: var(--border-strong);
    font-size: 20px;
}
.rating-item-info {
    flex: 1;
    min-width: 0;
}
.rating-item-name {
    font-family: var(--font-sans);
    font-size: clamp(12.5px, 3.2vw, 14px);
    font-weight: 600;
    color: var(--charcoal);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.rating-item-variant {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
}
.rating-item-rated-badge {
    font-size: 11px;
    color: #27ae60;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 3px;
}
.rating-stars-row {
    display: flex;
    flex-wrap: wrap;
    gap: clamp(4px, 1.5vw, 8px);
    margin-bottom: 0.5rem;
    justify-content: flex-start;
}
.rating-star {
    font-size: clamp(26px, 7vw, 32px);
    cursor: pointer;
    color: var(--border-strong);
    transition: color 0.15s, transform 0.15s;
    user-select: none;
    line-height: 1;
    padding: 2px;
    -webkit-tap-highlight-color: transparent;
}
.rating-star:hover,
.rating-star.active {
    color: #f0b429;
    transform: scale(1.12);
}
.rating-star.hovered {
    color: #f0b429;
}
.rating-comment {
    width: 100%;
    min-height: 52px;
    padding: 8px 10px;
    font-size: clamp(12px, 3.2vw, 13px);
    font-family: var(--font-sans);
    border: 1px solid rgba(255, 255, 255, 0.7);
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.55);
    resize: vertical;
    color: var(--charcoal);
    transition: border-color 0.2s;
    box-sizing: border-box;
}
.rating-comment:focus {
    outline: none;
    border-color: rgba(216, 120, 160, 0.55);
}
.rating-comment::placeholder {
    color: var(--muted);
}
.rating-submit-btn {
    min-width: min(100%, 160px);
    width: auto;
    flex: 0 1 auto;
    padding: 0.7rem 1.15rem;
    background: linear-gradient(135deg, #c24e68 0%, #d878a0 55%, #b070c8 100%);
    color: white;
    border: none;
    border-radius: 999px;
    font-family: var(--font-sans);
    font-size: clamp(13px, 3.4vw, 14px);
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
    white-space: nowrap;
}
.rating-submit-btn:hover { opacity: 0.9; }
.rating-submit-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

    top: 10px;
    left: 10px;
    right: 10px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
    pointer-events: none;
    z-index: 2;
}
.live-map-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 10px;
    border-radius: var(--radius-pill);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.02em;
    background: rgba(255, 255, 255, 0.92);
    color: var(--deep-sage);
    box-shadow: 0 2px 8px rgba(42, 35, 30, 0.12);
}
.live-map-chip.is-waiting {
    color: #9a6b2e;
}
.live-map-chip::before {
    content: '';
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #4caf50;
    box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.25);
    animation: liveMapPulse 1.6s ease-in-out infinite;
}
.live-map-chip.is-waiting::before {
    background: #e0a020;
    box-shadow: 0 0 0 3px rgba(224, 160, 32, 0.25);
    animation: none;
}
@keyframes liveMapPulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.65; transform: scale(0.92); }
}
.live-map-expand-btn {
    pointer-events: auto;
    width: 34px;
    height: 34px;
    border: none;
    border-radius: 50%;

.sdm-live-map-bottom {

    bottom: 10px;
    z-index: 2;

<script>
/* ═══════════════════════════════════════
   STATE
═══════════════════════════════════════ */
let _allOrders       = [];
let _filteredOrders  = [];
let _activeStatus    = 'all';
let _searchQuery     = '';
let _cartGroups      = [];

const STATUS_FILTER_OPTIONS = [
    { key: 'all',          label: 'All Orders' },
    { key: 'pending',      label: 'To Pay' },
    { key: 'processing',   label: 'To Ship' },
    { key: 'on_delivery',  label: 'To Receive' },
    { key: 'delivered',    label: 'Delivered' },
    { key: 'completed',    label: 'Completed' },
    { key: 'cancelled',    label: 'Cancelled' },
];

const STATUS_CONFIG = {
    pending:     { label: 'To Pay',      badge: 'badge-pending',     icon: 'ri-time-line',           progress: 0 },
    accepted:    { label: 'Preparing',  badge: 'badge-preparing',   icon: 'ri-box-1-line',          progress: 1 },
    preparing:   { label: 'Preparing',  badge: 'badge-preparing',   icon: 'ri-box-1-line',          progress: 1 },
    done_preparing: { label: 'Ready',  badge: 'badge-done_preparing',   icon: 'ri-checkbox-line',          progress: 2 },
    processing:  { label: 'Preparing',  badge: 'badge-processing',  icon: 'ri-box-1-line',          progress: 1 },
    on_delivery: { label: 'In Transit',  badge: 'badge-on_delivery', icon: 'ri-e-bike-line',         progress: 3 },
    delivered:   { label: 'Delivered',  badge: 'badge-delivered',   icon: 'ri-checkbox-circle-line',progress: 4 },
    completed:   { label: 'Completed',  badge: 'badge-completed',   icon: 'ri-award-line',          progress: 4 },
    cancelled:   { label: 'Cancelled',  badge: 'badge-cancelled',   icon: 'ri-close-circle-line',   progress: -1 },
};

const PROGRESS_STEPS = [
    { key: 'pending',     label: 'Order\nPlaced',  icon: 'ri-shopping-bag-line' },
    { key: 'preparing',   label: 'Preparing',      icon: 'ri-box-1-line' },
    { key: 'done_preparing', label: 'Ready',       icon: 'ri-checkbox-line' },
    { key: 'on_delivery', label: 'In Transit',     icon: 'ri-e-bike-line' },
    { key: 'delivered',   label: 'Delivered',      icon: 'ri-checkbox-circle-line' },
];

/* ═══════════════════════════════════════
   INIT
═══════════════════════════════════════ */
(async function init() {
    await Promise.all([loadOrders(), loadCartGroups()]);
    refreshOrdersView();
    queueMicrotask(() => maybeAutoOpenRatingModal());
})();

/* ═══════════════════════════════════════
   DATA
═══════════════════════════════════════ */
async function loadOrders() {
    try {
        const res  = await fetch(`/api/account/orders/data?_=${Date.now()}`, {
            cache: 'no-store',
            headers: { 'Cache-Control': 'no-cache', 'Pragma': 'no-cache' },
        });
        const data = await res.json();

        // Normalise — handle both array response and {orders:[]} wrapper
        _allOrders = Array.isArray(data) ? data : (data.orders || []);
    } catch (err) {
        console.error('Failed to load orders:', err);
        _allOrders = [];
    } finally {
        const skeleton = document.getElementById('ordersSkeleton');
        const content = document.getElementById('ordersContent');
        if (skeleton) skeleton.style.display = 'none';
        if (content) content.style.display = 'block';
    }
}

async function loadCartGroups() {
    try {
        if (typeof loadCart === 'function') {
            await loadCart();
        }

        const res = await fetch('/api/cart');
        const data = await res.json();
        const cartItems = Array.isArray(data?.cart?.items) ? data.cart.items : [];

        _cartGroups = normaliseCartGroups(cartItems);
    } catch (err) {
        console.error('Failed to load cart groups:', err);
        _cartGroups = [];
    }
}

function normaliseCartGroups(cartItems) {
    const groups = new Map();

    cartItems.forEach(item => {
        const storeId = item.store_id || item.product?.store_id;
        const storeName = item.store_name || item.product?.store_name || 'Store';
        const key = storeId || `store-${storeName}`;
        const price = Number(item.price || 0);
        const quantity = Number(item.quantity || 0);
        const addons = Array.isArray(item.addons) ? item.addons : [];
        const unitAddons = addons.reduce((s, a) => {
            const units = Math.max(1, Number(a.quantity || a.units || 1));
            return s + Number(a.price || 0) * units;
        }, 0);
        const addonsTotal = Number(item.addons_total != null ? item.addons_total : unitAddons);
        const lineTotal = (price * quantity) + addonsTotal;

        if (!groups.has(key)) {
            groups.set(key, {
                source: 'cart',
                id: `cart-${key}`,
                store_id: storeId,
                store_name: storeName,
                status: 'pending',
                payment_status: 'pending',
                created_at: item.updated_at || item.created_at || null,
                items: [],
                total_amount: 0,
                item_count: 0
            });
        }

        const group = groups.get(key);
        group.items.push({
            id: item.id,
            cart_item_id: item.id,
            product_id: item.product_id,
            variant_id: item.variant_id,
            name: item.name || item.product?.name || 'Product',
            product_name: item.name || item.product?.name || 'Product',
            variant_name: item.variant?.name || null,
            quantity,
            price,
            total: lineTotal,
            addons,
            addons_total: addonsTotal,
            image_url: item.image_url || null,
            product_image_url: item.image_url || null,
            is_selected: Boolean(item.is_selected)
        });
        group.total_amount += lineTotal;
        group.item_count += quantity;
    });

    return Array.from(groups.values());
}

function refreshOrdersView() {
    updateTabCounts();
    applyFilters();
}

/* ═══════════════════════════════════════
   FILTERS
═══════════════════════════════════════ */
function filterOrdersByStatus(status, btn) {
    _activeStatus = status;
    document.querySelectorAll('.order-tab').forEach(t => t.classList.remove('active'));
    const tabBtn = btn && btn.classList && btn.classList.contains('order-tab')
        ? btn
        : document.querySelector(`.order-tab[data-status="${status}"]`);
    if (tabBtn) tabBtn.classList.add('active');
    syncMobileStatusFilter();
    applyFilters();
    closeOrderStatusSheet();
}

function currentStatusFilterLabel() {
    const opt = STATUS_FILTER_OPTIONS.find(o => o.key === _activeStatus);
    return opt ? opt.label : 'All Orders';
}

function countForStatusFilter(key) {
    if (key === 'all') {
        return _cartGroups.length + _allOrders.filter(o => getDisplayState(o).key !== 'pending').length;
    }
    if (key === 'pending') return _cartGroups.length;
    return _allOrders.filter(o => getDisplayState(o).key === key).length;
}

function syncMobileStatusFilter() {
    const label = currentStatusFilterLabel();
    const ddLabel = document.getElementById('ordersStatusDropdownLabel');
    const dd = document.getElementById('ordersStatusDropdown');
    if (ddLabel) ddLabel.textContent = label;
    if (dd) dd.setAttribute('aria-label', `Filter orders. Current filter: ${label}`);

    const list = document.getElementById('ordersStatusSheetList');
    if (!list) return;
    list.innerHTML = STATUS_FILTER_OPTIONS.map(opt => {
        const active = opt.key === _activeStatus;
        const count = countForStatusFilter(opt.key);
        const ico = active ? 'ri-checkbox-fill' : 'ri-checkbox-blank-line';
        const end = active ? 'ri-check-line' : 'ri-arrow-right-s-line';
        return `<button type="button"
            class="orders-status-sheet-row${active ? ' is-active' : ''}"
            role="option"
            aria-selected="${active ? 'true' : 'false'}"
            aria-label="Filter orders by ${opt.label}"
            onclick="filterOrdersByStatus('${opt.key}')">
            <i class="${ico} orders-status-sheet-ico" aria-hidden="true"></i>
            <span class="orders-status-sheet-label">${opt.label}</span>
            <span class="orders-status-sheet-count">${count}</span>
            <i class="${end} orders-status-sheet-end" aria-hidden="true"></i>
        </button>`;
    }).join('');
}

function openOrderStatusSheet() {
    syncMobileStatusFilter();
    const overlay = document.getElementById('ordersStatusSheetOverlay');
    const dd = document.getElementById('ordersStatusDropdown');
    if (!overlay) return;
    overlay.classList.add('active');
    if (dd) dd.setAttribute('aria-expanded', 'true');
    document.body.style.overflow = 'hidden';
    if (typeof updateChatFabVisibility === 'function') updateChatFabVisibility();
}

function closeOrderStatusSheet() {
    const overlay = document.getElementById('ordersStatusSheetOverlay');
    const dd = document.getElementById('ordersStatusDropdown');
    if (overlay) overlay.classList.remove('active');
    if (dd) dd.setAttribute('aria-expanded', 'false');
    document.body.style.overflow = '';
    if (typeof updateChatFabVisibility === 'function') updateChatFabVisibility();
}

document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    const overlay = document.getElementById('ordersStatusSheetOverlay');
    if (overlay && overlay.classList.contains('active')) closeOrderStatusSheet();
});

function filterOrdersBySearch(q) {
    _searchQuery = q.toLowerCase().trim();
    applyFilters();
}

function applyFilters() {
    let result = [];

    if (_activeStatus === 'all') {
        result = [
            ..._cartGroups,
            ..._allOrders.filter(o => getDisplayState(o).key !== 'pending')
        ];
    } else if (_activeStatus === 'pending') {
        result = [..._cartGroups];
    } else {
        result = _allOrders.filter(o => getDisplayState(o).key === _activeStatus);
    }

    if (_searchQuery) {
        result = result.filter(o =>
            String(o.id || o.order_number || '').toLowerCase().includes(_searchQuery) ||
            (o.store_name || '').toLowerCase().includes(_searchQuery) ||
            (o.items || []).some(i => (i.name || i.product_name || '').toLowerCase().includes(_searchQuery))
        );
    }

    _filteredOrders = result;
    renderOrders(_filteredOrders);
}

function updateTabCounts() {
    const total = countForStatusFilter('all');
    const el    = document.getElementById('count-all');
    if (el) el.textContent = total;

    ['pending','processing','on_delivery','delivered','completed'].forEach(s => {
        const n = countForStatusFilter(s);
        const cnt = document.getElementById(`count-${s}`);
        if (cnt) {
            if (n > 0) { cnt.textContent = n; cnt.style.display = 'inline-flex'; }
            else        { cnt.style.display = 'none'; }
        }
    });
    syncMobileStatusFilter();
}

/** Subtotal, delivery, and grand total for customer orders (API total can omit delivery / add-ons). */
function customerOrderAmounts(order) {
    const items = order.items || [];
    const fromItems = items.reduce((s, i) => s + orderItemLineTotal(i), 0);
    const apiSub = Number(order.subtotal_amount ?? order.subtotal ?? 0) || 0;
    const hasAddons = items.some(i =>
        (Array.isArray(i.addons) && i.addons.length > 0) || Number(i.addons_total || 0) > 0
    );
    // Prefer item-line sum when add-ons exist or when it exceeds a stale API subtotal
    const sub = (hasAddons && fromItems > 0)
        ? fromItems
        : (fromItems > apiSub + 0.009 ? fromItems : (apiSub || fromItems));
    const delivery = Number(order.delivery_fee ?? 0) || 0;
    const computedTotal = sub + delivery;
    const apiTotal = Number(order.total_amount ?? order.total);
    const total =
        hasAddons || (fromItems > apiSub + 0.009)
            ? computedTotal
            : (
                Number.isFinite(apiTotal) &&
                apiTotal > 0 &&
                !(delivery > 0 && Math.abs(apiTotal - apiSub) <= 0.01 && computedTotal > apiTotal + 0.01)
                    ? apiTotal
                    : computedTotal
            );
    return { sub, delivery, total };
}

function buildCTAButtons(order) {
    const id = order.id;
    const display = getDisplayState(order);
    const paymentStatus = order.payment_status || '';
    const paymentMethod = String(order.payment_method || '').trim().toLowerCase();
    const isCodPending = paymentMethod === 'cod' && (paymentStatus === 'cod_pending' || order.status === 'pending');
    let btns = `<button class="btn-order-action" onclick="viewOrderDetail(${id})">View Details</button>`;

    if (display.key === 'pending') {
        btns += `<button class="btn-order-action primary" onclick="payOrder(${id})"><i class="ri-bank-card-line"></i> Pay Now</button>`;
        btns += `<button class="btn-order-action danger" onclick="cancelOrderFromCard(${id})">Cancel</button>`;
    }
    // COD awaiting seller confirmation — allow cancel, never show Pay Now
    if (isCodPending && display.key === 'processing') {
        btns += `<button class="btn-order-action danger" onclick="cancelOrderFromCard(${id})">Cancel</button>`;
    }
    if (display.key === 'delivered') {
        btns += `<button class="btn-order-action primary" onclick="completeOrder(${id})"><i class="ri-check-double-line"></i> Complete</button>`;
    }
    if (display.key === 'delivered' || display.key === 'completed') {
        if (!order.all_rated) {
            btns += `<button class="btn-order-action primary" onclick="rateOrder(${id})"><i class="ri-star-line"></i> Rate</button>`;
        }
        btns += `<button class="btn-order-action" onclick="reorderItems(${id})"><i class="ri-refresh-line"></i> Buy Again</button>`;
    }

    return btns;
}

function orderItemRatingStarsHtml(item) {
    const rating = Math.round(Number(item && item.rating != null ? item.rating : 0));
    if (!(rating >= 1 && rating <= 5)) return '';
    const stars = [1, 2, 3, 4, 5].map(s =>
        `<i class="ri-star-${s <= rating ? 'fill' : 'line'}" aria-hidden="true"></i>`
    ).join('');
    return `<span class="order-item-rating" title="Your rating: ${rating}/5" aria-label="Your rating ${rating} out of 5">${stars}</span>`;
}

/* ═══════════════════════════════════════
   LIVE DELIVERY MAP (web parity with Flutter)
═══════════════════════════════════════ */
const LiveOrderMap = (function() {
    let pollTimer = null;
    let map = null;
    let expandedMap = null;
    let orderId = null;
    let markers = { rider: null, customer: null, store: null };
    let expandedMarkers = { rider: null, customer: null, store: null };
    let state = { rider: null, customer: null, store: null, route: [], etaMin: null, live: false, riderName: '' };
    let fetchingRoute = false;
    let didInitialFit = false;
    let expandBound = false;

    function haversineKm(a, b) {
        const r = 6371;
        const dLat = (b.lat - a.lat) * Math.PI / 180;
        const dLng = (b.lng - a.lng) * Math.PI / 180;
        const x = Math.sin(dLat / 2) ** 2 +
            Math.cos(a.lat * Math.PI / 180) * Math.cos(b.lat * Math.PI / 180) *
            Math.sin(dLng / 2) ** 2;
        return r * 2 * Math.asin(Math.sqrt(x));
    }

    function ensureToken() {
        return window.MAPBOX_TOKEN || document.getElementById('mapbox-token')?.value || '';
    }

    function formatTrackingTime(iso) {
        if (!iso) return 'just now';
        const d = new Date(iso);
        if (Number.isNaN(d.getTime())) return 'just now';
        const sec = Math.floor((Date.now() - d.getTime()) / 1000);
        if (sec < 60) return 'just now';
        if (sec < 3600) return `${Math.floor(sec / 60)}m ago`;
        return formatDateTimePH(iso);
    }

    function makePin(cls, icon) {
        const el = document.createElement('div');
        el.className = 'live-map-pin ' + cls;
        el.innerHTML = '<i class="' + icon + '"></i>';
        return el;
    }

    function setMarker(targetMap, bucket, key, lngLat, cls, icon) {
        if (!targetMap || !lngLat) return;
        if (bucket[key]) {
            bucket[key].setLngLat(lngLat);
            return;
        }
        bucket[key] = new mapboxgl.Marker({ element: makePin(cls, icon), anchor: 'center' })
            .setLngLat(lngLat)
            .addTo(targetMap);
    }

    function removeMarker(bucket, key) {
        if (bucket[key]) {
            bucket[key].remove();
            bucket[key] = null;
        }
    }

    function updateRouteOnMap(targetMap, coords) {
        if (!targetMap || !coords?.length) return;
        const geo = { type: 'Feature', geometry: { type: 'LineString', coordinates: coords } };
        const srcId = targetMap === expandedMap ? 'live-route-expanded' : 'live-route';
        const layerId = targetMap === expandedMap ? 'live-route-line-expanded' : 'live-route-line';
        if (targetMap.getSource(srcId)) {
            targetMap.getSource(srcId).setData(geo);
        } else {
            targetMap.addSource(srcId, { type: 'geojson', data: geo });
            targetMap.addLayer({
                id: layerId,
                type: 'line',
                source: srcId,
                layout: { 'line-join': 'round', 'line-cap': 'round' },
                paint: { 'line-color': '#b5445a', 'line-width': 4, 'line-opacity': 0.85 },
            });
        }
    }

    async function fetchOsrmRoute(start, end) {
        const url = `https://router.project-osrm.org/route/v1/driving/${start.lng},${start.lat};${end.lng},${end.lat}?overview=full&geometries=geojson`;
        const res = await fetch(url);
        const data = await res.json();
        if (!data.routes?.length) return null;
        const route = data.routes[0];
        return {
            coords: route.geometry.coordinates,
            etaMin: Math.max(1, Math.round(route.duration / 60)),
        };
    }

    function fitMap(targetMap, force) {
        if (!targetMap) return;
        const points = [];
        if (state.rider) points.push([state.rider.lng, state.rider.lat]);
        if (state.customer) points.push([state.customer.lng, state.customer.lat]);
        if (state.store && !state.rider) points.push([state.store.lng, state.store.lat]);
        if (!points.length) return;
        const isExpanded = targetMap === expandedMap;
        const padding = isExpanded
            ? { top: 72, bottom: 120, left: 48, right: 48 }
            : 56;
        if (points.length === 1) {
            targetMap.setCenter(points[0]);
            targetMap.setZoom(15);
        } else {
            const bounds = points.reduce(
                (b, p) => b.extend(p),
                new mapboxgl.LngLatBounds(points[0], points[0])
            );
            targetMap.fitBounds(bounds, { padding, maxZoom: 16, duration: force ? 0 : 400 });
        }
    }

    function updateExpandedDetails(d) {
        const waiting = !state.rider;
        const name = (d?.rider_name || state.riderName || '').trim();
        const titleEl = document.getElementById('liveMapExpandDetailsTitle');
        const subEl = document.getElementById('liveMapExpandDetailsSub');
        const etaEl = document.getElementById('liveMapExpandDetailsEta');
        const chipEl = document.getElementById('liveMapExpandChip');
        if (!titleEl) return;

        titleEl.textContent = waiting
            ? 'Rider is heading out'
            : (state.etaMin != null ? `Arriving in ${state.etaMin} min` : 'Rider is on the way');
        subEl.textContent = waiting
            ? 'Waiting for live location'
            : (name || 'Your order is on the way');

        if (etaEl) {
            const showEta = state.etaMin != null && !waiting;
            etaEl.style.display = showEta ? '' : 'none';
            etaEl.textContent = showEta ? `${state.etaMin} min` : '';
        }
        if (chipEl) {
            chipEl.textContent = waiting ? 'CONNECTING' : 'LIVE';
            chipEl.classList.toggle('is-waiting', waiting);
        }
    }

    function syncMarkersToMap(targetMap, bucket) {
        if (!targetMap) return;
        if (state.store) setMarker(targetMap, bucket, 'store', [state.store.lng, state.store.lat], 'live-map-pin--store', 'ri-store-2-line');
        if (state.customer) setMarker(targetMap, bucket, 'customer', [state.customer.lng, state.customer.lat], 'live-map-pin--customer', 'ri-home-smile-line');
        if (state.rider) setMarker(targetMap, bucket, 'rider', [state.rider.lng, state.rider.lat], 'live-map-pin--rider', 'ri-e-bike-line');
        else removeMarker(bucket, 'rider');
        if (state.route.length) updateRouteOnMap(targetMap, state.route);
    }

    function updateUi(d) {
        const chip = document.getElementById('liveMapChip');
        const eta = document.getElementById('liveMapEta');
        const sub = document.getElementById('liveMapSub');
        if (!chip) return;
        const waiting = !state.rider;
        chip.textContent = waiting ? 'Waiting for rider GPS…' : 'Live tracking';
        chip.classList.toggle('is-waiting', waiting);
        if (eta) {
            const showEta = state.etaMin && !waiting;
            eta.style.display = showEta ? '' : 'none';
            eta.textContent = showEta ? `~${state.etaMin} min` : '';
        }
        if (sub) {
            const name = d?.rider_name || state.riderName || 'Your rider';
            sub.textContent = waiting
                ? `${name} is on the way`
                : `${name} · updated ${formatTrackingTime(d?.rider_updated_at)}`;
        }
        updateExpandedDetails(d);
    }

    function stopPollOnly() {
        if (pollTimer) {
            clearInterval(pollTimer);
            pollTimer = null;
        }
    }

    function destroyMapInstance(target) {
        if (!target) return;
        try { target.remove(); } catch (_) {}
    }

    function clearMarkerBucket(bucket) {
        Object.keys(bucket).forEach(k => removeMarker(bucket, k));
    }

    async function refresh() {
        if (!orderId) return;
        try {
            const res = await fetch(`/api/account/orders/${orderId}/tracking`, { credentials: 'same-origin' });
            if (!res.ok) return;
            const d = await res.json();
            state.live = d.live === true;
            state.riderName = d.rider_name || state.riderName;

            const rider = (d.rider_latitude != null && d.rider_longitude != null)
                ? { lat: d.rider_latitude, lng: d.rider_longitude } : null;
            const customer = (d.customer_latitude != null && d.customer_longitude != null)
                ? { lat: d.customer_latitude, lng: d.customer_longitude } : null;
            const store = (d.store_latitude != null && d.store_longitude != null)
                ? { lat: d.store_latitude, lng: d.store_longitude } : null;

            const moved = rider && state.rider && haversineKm(state.rider, rider) * 1000 >= 20;
            state.rider = rider || state.rider;
            state.customer = customer || state.customer;
            state.store = store || state.store;

            if (!state.live) {
                stopPollOnly();
                updateUi(d);
                return;
            }

            if (map && map.isStyleLoaded()) {
                syncMarkersToMap(map, markers);
                if (expandedMap && expandedMap.isStyleLoaded()) syncMarkersToMap(expandedMap, expandedMarkers);

                const needRoute = moved || (!state.route.length && (state.rider || state.store) && state.customer);
                if (needRoute && !fetchingRoute) {
                    fetchingRoute = true;
                    const start = state.rider || state.store;
                    const end = state.customer;
                    if (start && end) {
                        const info = await fetchOsrmRoute(start, end);
                        if (info) {
                            state.route = info.coords;
                            state.etaMin = info.etaMin;
                            updateRouteOnMap(map, state.route);
                            if (expandedMap) updateRouteOnMap(expandedMap, state.route);
                        }
                    }
                    fetchingRoute = false;
                }

                if (!didInitialFit) {
                    fitMap(map);
                    didInitialFit = true;
                } else if (moved) {
                    fitMap(map);
                    if (expandedMap) fitMap(expandedMap, true);
                }
            }

            updateUi(d);
        } catch (err) {
            console.warn('Live tracking refresh failed', err);
        }
    }

    function initMap(container) {
        const token = ensureToken();
        if (!token || typeof mapboxgl === 'undefined') {
            container.innerHTML = '<div class="live-map-unavailable">Map unavailable — Mapbox is not configured.</div>';
            return null;
        }
        mapboxgl.accessToken = token;
        const instance = new mapboxgl.Map({
            container,
            style: 'mapbox://styles/mapbox/streets-v12',
            center: [121.4113, 14.2691],
            zoom: 12,
            interactive: false,
            attributionControl: false,
        });
        instance.on('load', () => {
            instance.resize();
            refresh();
        });
        return instance;
    }

    function ensureExpandOverlay() {
        let overlay = document.getElementById('liveMapExpandOverlay');
        const needsBuild = !overlay || !overlay.querySelector('.live-map-expand-map-wrap .live-map-expand-details');
        if (overlay && needsBuild) {
            overlay.remove();
            overlay = null;
        }
        if (overlay) return overlay;
        overlay = document.createElement('div');
        overlay.id = 'liveMapExpandOverlay';
        overlay.innerHTML = `
            <div class="live-map-expand-map-wrap">
                <div id="liveMapExpandedCanvas"></div>
                <button type="button" class="live-map-float-btn live-map-float-close" id="liveMapExpandClose" aria-label="Close map">
                    <i class="ri-close-line"></i>
                </button>
                <button type="button" class="live-map-float-btn live-map-float-recenter" id="liveMapRecenterBtn" aria-label="Recenter map">
                    <i class="ri-focus-3-line"></i>
                </button>
                <span class="live-map-chip live-map-chip--overlay is-waiting" id="liveMapExpandChip">CONNECTING</span>
                <div class="live-map-expand-details" id="liveMapExpandDetails">
                    <div class="live-map-details-avatar" aria-hidden="true"><i class="ri-e-bike-line"></i></div>
                    <div class="live-map-details-text">
                        <div class="live-map-details-title" id="liveMapExpandDetailsTitle">Rider is heading out</div>
                        <div class="live-map-details-sub" id="liveMapExpandDetailsSub">Waiting for live location</div>
                    </div>
                    <span class="live-map-details-eta" id="liveMapExpandDetailsEta" style="display:none;"></span>
                    <button type="button" class="live-map-details-chat" id="liveMapExpandChatBtn" title="Chat with rider" aria-label="Chat with rider">
                        <i class="ri-chat-3-line"></i>
                    </button>
                </div>
            </div>`;
        document.body.appendChild(overlay);
        overlay.querySelector('#liveMapExpandClose').addEventListener('click', closeExpanded);
        overlay.querySelector('#liveMapRecenterBtn').addEventListener('click', () => {
            if (expandedMap) fitMap(expandedMap, true);
        });
        overlay.querySelector('#liveMapExpandChatBtn').addEventListener('click', () => {
            if (!orderId) return;
            closeExpanded();
            if (window.chatWidget && typeof chatWidget.openWithRiderOrder === 'function') {
                chatWidget.openWithRiderOrder(orderId);
            }
        });
        return overlay;
    }

    function openExpanded(e) {
        e?.preventDefault();
        e?.stopPropagation();
        if (!map || typeof mapboxgl === 'undefined') return;

        const overlay = ensureExpandOverlay();
        overlay.classList.add('open');
        document.body.style.overflow = 'hidden';

        if (expandedMap) {
            expandedMap.remove();
            expandedMap = null;
            clearMarkerBucket(expandedMarkers);
        }

        expandedMap = new mapboxgl.Map({
            container: 'liveMapExpandedCanvas',
            style: 'mapbox://styles/mapbox/streets-v12',
            center: map.getCenter(),
            zoom: map.getZoom(),
            interactive: true,
        });
        expandedMap.addControl(new mapboxgl.NavigationControl(), 'top-right');
        expandedMap.on('load', () => {
            expandedMap.resize();
            syncMarkersToMap(expandedMap, expandedMarkers);
            if (state.route.length) updateRouteOnMap(expandedMap, state.route);
            fitMap(expandedMap, true);
            updateExpandedDetails({ rider_name: state.riderName });
        });
    }

    function closeExpanded() {
        const overlay = document.getElementById('liveMapExpandOverlay');
        if (overlay) overlay.classList.remove('open');
        document.body.style.overflow = '';
        destroyMapInstance(expandedMap);
        expandedMap = null;
        clearMarkerBucket(expandedMarkers);
    }

    function bindExpand() {
        if (expandBound) return;
        const btn = document.getElementById('liveMapExpandBtn');
        if (!btn) return;
        btn.addEventListener('click', openExpanded);
        expandBound = true;
    }

    function start(id) {
        stop();
        orderId = id;
        expandBound = false;
        const container = document.getElementById('liveDeliveryMap');
        if (!container) return;

        map = initMap(container);
        if (!map) return;

        bindExpand();
        pollTimer = setInterval(refresh, 8000);
    }

    function stop() {
        stopPollOnly();
        closeExpanded();
        destroyMapInstance(map);
        map = null;
        orderId = null;
        clearMarkerBucket(markers);
        clearMarkerBucket(expandedMarkers);
        state = { rider: null, customer: null, store: null, route: [], etaMin: null, live: false, riderName: '' };
        fetchingRoute = false;
        didInitialFit = false;
        expandBound = false;
    }

    return { start, stop, refresh };
})();

async function viewOrderDetail(orderId) {
    const modal = document.getElementById('orderDetailModal');

    const title = document.getElementById('orderDetailTitle');

    modal.classList.add('active');
    modal.style.display = 'flex';

    LiveOrderMap.stop();

    try {
        const res   = await fetch(`/api/account/orders/${orderId}`);
        const order = await res.json();

        title.textContent = `Order #${order.order_number || String(orderId).padStart(4,'0')}`;
        body.innerHTML    = buildOrderDetailHTML(order);
        if (order.status === 'on_delivery' && (order.rider_id || order.rider_name)) {

function viewCartGroupDetail(storeId) {
    const group = _cartGroups.find(entry => String(entry.store_id) === String(storeId) || String(entry.id) === String(storeId));
    if (!group) {
        showOrderToast('Cart details unavailable.');

async function fetchCartGroupDeliveryEstimate(group) {
    try {
        if (!group || !group.store_id) return null;

        const addresses = typeof fetchCheckoutAddresses === 'function'
            ? await fetchCheckoutAddresses()
            : [];
        if (!addresses.length) {
            return { can_deliver: null, note: 'Add a delivery address to see the estimated fee.' };
        }

        const address = addresses.find(a => a.is_default) || addresses[0];
        const itemIds = (group.items || [])
            .map(item => item.cart_item_id || item.id)
            .filter(Boolean)
            .map(id => ({ item_id: Number(id) }));

        if (!itemIds.length) return null;

        const token = await getAuthToken();
        const response = await fetch('/api/v1/checkout/validate', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + token,
            },
            body: JSON.stringify({
                delivery_address_id: address.id,
                items: itemIds,
            }),
        });

        const data = await response.json().catch(() => ({}));
        const storeId = String(group.store_id);

        const matched = Array.isArray(data.orders)
            ? data.orders.find(o => String(o.store_id) === storeId)
            : null;
        if (matched) {
            return {
                can_deliver: true,
                delivery_fee: Number(matched.delivery_fee) || 0,
                subtotal: Number(matched.subtotal) || Number(group.total_amount) || 0,
                total: Number(matched.total) || 0,
                distance_km: matched.distance_km,
                address_label: address.address_label || address.address_line || 'Default address',
            };
        }

        const blocked = Array.isArray(data.undeliverable_stores)
            ? data.undeliverable_stores.find(s => String(s.store_id) === storeId)
            : null;
        if (blocked) {
            return {
                can_deliver: false,
                note: 'Outside delivery area for your saved address.',
                address_label: address.address_label || address.address_line || 'Default address',
            };
        }

        return {
            can_deliver: null,
            note: data.error || 'Could not estimate delivery fee right now.',
        };
    } catch (err) {
        console.error('Cart delivery estimate error:', err);
        return { can_deliver: null, note: 'Could not estimate delivery fee right now.' };
    }
}

/* ═══════════════════════════════════════
   ACTIONS

const CUSTOMER_CANCEL_REASONS = [
    { code: 'changed_mind', label: 'I changed my mind' },
    { code: 'ordered_by_mistake', label: 'Ordered by mistake' },
    { code: 'wrong_details', label: 'Wrong item / address details' },
    { code: 'delivery_time', label: 'Delivery time no longer works' },
    { code: 'found_alternative', label: 'Found another store / product' },
    { code: 'payment_issue', label: 'Payment / checkout issue' },
    { code: 'other', label: 'Other' },
];

let _cancelOrderId = null;
let _cancelReasonCode = null;

function closeCancelOrderModal() {
    const modal = document.getElementById('cancelOrderModal');
    if (!modal) return;
    modal.classList.remove('active');
    modal.style.display = 'none';
    _cancelOrderId = null;
    _cancelReasonCode = null;
    const err = document.getElementById('cancelReasonError');
    if (err) { err.style.display = 'none'; err.textContent = ''; }
    const details = document.getElementById('cancelReasonDetails');
    if (details) details.value = '';
    const otherWrap = document.getElementById('cancelReasonOtherWrap');
    if (otherWrap) otherWrap.style.display = 'none';
    const btn = document.getElementById('confirmCancelOrderBtn');
    if (btn) { btn.disabled = false; btn.textContent = 'Cancel order'; }
}

function openCancelOrderModal(orderId) {
    _cancelOrderId = orderId;
    _cancelReasonCode = null;
    const chips = document.getElementById('cancelReasonChips');
    if (chips) {
        chips.innerHTML = CUSTOMER_CANCEL_REASONS.map(r =>
            `<button type="button" class="cancel-reason-chip" role="option" data-code="${r.code}" onclick="selectCancelReason('${r.code}', this)">${r.label}</button>`
        ).join('');
    }
    const otherWrap = document.getElementById('cancelReasonOtherWrap');
    if (otherWrap) otherWrap.style.display = 'none';
    const details = document.getElementById('cancelReasonDetails');
    if (details) details.value = '';
    const count = document.getElementById('cancelReasonCharCount');
    if (count) count.textContent = '0';
    const err = document.getElementById('cancelReasonError');
    if (err) { err.style.display = 'none'; err.textContent = ''; }

    const modal = document.getElementById('cancelOrderModal');
    if (!modal) return;
    modal.style.display = 'flex';
    modal.classList.add('active');
}

function selectCancelReason(code, btn) {
    _cancelReasonCode = code;
    document.querySelectorAll('#cancelReasonChips .cancel-reason-chip').forEach(el => {
        el.classList.toggle('is-selected', el === btn);
    });
    const otherWrap = document.getElementById('cancelReasonOtherWrap');
    if (otherWrap) {
        otherWrap.style.display = (code === 'other') ? 'block' : 'none';
    }
    const err = document.getElementById('cancelReasonError');
    if (err) { err.style.display = 'none'; err.textContent = ''; }
    if (code === 'other') {
        const details = document.getElementById('cancelReasonDetails');
        if (details) details.focus();
    }
}

document.getElementById('cancelReasonDetails')?.addEventListener('input', function () {
    const count = document.getElementById('cancelReasonCharCount');
    if (count) count.textContent = String(this.value.length);
});

async function submitCancelOrder() {
    if (!_cancelOrderId) return;
    const err = document.getElementById('cancelReasonError');
    const showErr = (msg) => {
        if (!err) return;
        err.textContent = msg;
        err.style.display = 'block';
    };
    if (!_cancelReasonCode) {
        showErr('Please select a cancellation reason.');
        return;
    }
    const details = (document.getElementById('cancelReasonDetails')?.value || '').trim();
    if (_cancelReasonCode === 'other' && details.length < 5) {
        showErr('Please tell us specifically why you are cancelling (at least 5 characters).');
        return;
    }

    const btn = document.getElementById('confirmCancelOrderBtn');
    if (btn) { btn.disabled = true; btn.textContent = 'Cancelling…'; }

    try {
        const res = await fetch(`/api/account/orders/${_cancelOrderId}/cancel`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                reason_code: _cancelReasonCode,
                reason: details || undefined,
            }),
        });
        const d = await res.json();
        if (d.success) {
            const orderId = _cancelOrderId;
            closeCancelOrderModal();
            showOrderToast('Order cancelled.');
            const cancelled = d.order || null;
            const idx = _allOrders.findIndex(o => Number(o.id) === Number(orderId));
            if (idx >= 0) {
                _allOrders[idx] = cancelled
                    ? { ..._allOrders[idx], ...cancelled, status: 'cancelled' }
                    : { ..._allOrders[idx], status: 'cancelled' };
            }
            refreshOrdersView();

            const detailModal = document.getElementById('orderDetailModal');
            if (detailModal && detailModal.classList.contains('active')) {
                if (cancelled) {
                    const title = document.getElementById('orderDetailTitle');
                    const body = document.getElementById('orderDetailBody');
                    if (title) title.textContent = `Order #${cancelled.order_number || String(orderId).padStart(4,'0')}`;
                    if (body) body.innerHTML = buildOrderDetailHTML(cancelled);
                } else {
                    await viewOrderDetail(orderId);
                }
            }
            loadOrders().then(() => refreshOrdersView());
        } else {
            showErr(d.message || 'Could not cancel order.');
            if (btn) { btn.disabled = false; btn.textContent = 'Cancel order'; }
        }
    } catch {
        showErr('Error cancelling order.');
        if (btn) { btn.disabled = false; btn.textContent = 'Cancel order'; }
    }
}

async function cancelOrderFromCard(orderId) {

async function completeOrder(orderId) {
    if (!await window.openConfirmModal('Mark this order as completed?')) return;
    try {
        const res = await fetch(`/api/account/orders/${orderId}/complete`, { method: 'POST' });
        const d = await res.json();
        if (d.success) {
            showOrderToast('Order marked as completed.');

            // Update local list immediately (same pattern as cancel) — don't wait on reload
            const completed = d.order || null;
            const idx = _allOrders.findIndex(o => Number(o.id) === Number(orderId));
            if (idx >= 0) {
                _allOrders[idx] = completed
                    ? { ..._allOrders[idx], ...completed, status: 'completed' }
                    : { ..._allOrders[idx], status: 'completed' };
            }

            // If viewing Delivered, follow the order into Completed
            if (_activeStatus === 'delivered') {
                _activeStatus = 'completed';
                document.querySelectorAll('.order-tab').forEach(t => {
                    t.classList.toggle('active', t.getAttribute('data-status') === 'completed');
                });
                syncMobileStatusFilter();
            }

            refreshOrdersView();

            // Refresh open detail modal if this order is showing
            const detailModal = document.getElementById('orderDetailModal');
            if (detailModal && detailModal.classList.contains('active')) {
                const updated = _allOrders.find(o => Number(o.id) === Number(orderId));
                if (updated) {
                    const title = document.getElementById('orderDetailTitle');
                    const body = document.getElementById('orderDetailBody');
                    if (title) title.textContent = `Order #${updated.order_number || String(orderId).padStart(4,'0')}`;
                    if (body) body.innerHTML = buildOrderDetailHTML(updated);
                }
            }

            const localOrder = _allOrders.find(o => Number(o.id) === Number(orderId));
            const alreadyRated = !!(localOrder && localOrder.all_rated);

            // Background refresh to stay in sync; keep local completed if fetch is stale
            loadOrders().then(() => {
                const still = _allOrders.find(o => Number(o.id) === Number(orderId));
                if (still && still.status !== 'completed' && completed) {
                    const i = _allOrders.findIndex(o => Number(o.id) === Number(orderId));
                    if (i >= 0) {
                        _allOrders[i] = { ..._allOrders[i], ...completed, status: 'completed' };
                    }
                }
                refreshOrdersView();
            });

            // Only prompt for ratings when something is still unrated
            if (!alreadyRated) {
                try { sessionStorage.removeItem('ratingPromptDismissed_' + orderId); } catch (e) {}
                rateOrder(orderId, false);
            }
        } else {
            showOrderToast(d.message || 'Could not complete order.');
        }
    } catch {
        showOrderToast('Error completing order.');
    }
}
