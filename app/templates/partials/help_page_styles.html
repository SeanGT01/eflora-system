<style>
    /* ── Help atmosphere (matches storefront cream + blush) ── */
    body:has(.help-atmosphere) {
        background:
            radial-gradient(ellipse 80% 55% at 0% -10%, rgba(242, 196, 206, 0.42), transparent 58%),
            radial-gradient(ellipse 60% 45% at 100% 8%, rgba(122, 158, 126, 0.14), transparent 55%),
            radial-gradient(ellipse 50% 40% at 70% 100%, rgba(212, 120, 138, 0.12), transparent 50%),
            var(--cream);
    }
    body:has(.help-atmosphere) .main-content {
        background: transparent;
        max-width: min(1200px, 100%);
        width: 100%;
        box-sizing: border-box;
        position: relative;
        z-index: 1;
    }

    /* Keep chrome above the fixed white florals (same as homepage) */
    body:has(.help-atmosphere) .main-header,
    body:has(.help-atmosphere) .main-nav,
    body:has(.help-atmosphere) .main-footer,
    body:has(.help-atmosphere) footer {
        position: relative;
        z-index: 1;
    }
    body:has(.help-atmosphere) .main-header {
        z-index: 1000;
    }
    body:has(.help-atmosphere) .main-nav {
        z-index: 999;
    }

    .help-atmosphere {
        position: relative;
        width: 100%;
        max-width: min(1040px, 100%);
        margin: 0 auto;
        /* Side padding so soft panel shadows aren’t clipped into a “margin” strip */
        padding: 0.5rem clamp(0.35rem, 1.2vw, 0.75rem) clamp(3rem, 6vw, 5rem);
        isolation: isolate;
        overflow: visible;
        box-sizing: border-box;
    }

    .help-glow {
        position: absolute;
        border-radius: 50%;
        pointer-events: none;
        z-index: 0;
        filter: blur(2px);
    }
    .help-glow--1 {
        width: clamp(160px, 22vw, 300px);
        height: clamp(160px, 22vw, 300px);
        top: -40px; right: -40px;
        background: radial-gradient(circle, rgba(242, 196, 206, 0.55) 0%, transparent 70%);
        animation: helpFloat 9s ease-in-out infinite;
    }
    .help-glow--2 {
        width: clamp(140px, 18vw, 240px);
        height: clamp(140px, 18vw, 240px);
        bottom: 12%; left: -50px;
        background: radial-gradient(circle, rgba(122, 158, 126, 0.22) 0%, transparent 70%);
        animation: helpFloat 11s ease-in-out infinite reverse;
    }
    @keyframes helpFloat {
        0%, 100% { transform: translate3d(0, 0, 0); }
        50% { transform: translate3d(12px, -18px, 0); }
    }
    html.fx-lite .help-glow,
    html.perf-lite .help-glow {
        animation: none;
    }
    @media (prefers-reduced-motion: reduce) {
        .help-glow { animation: none; }
    }

    .help-page {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 100%;
        margin: 0 auto;
        padding: 0;
        box-sizing: border-box;
    }

    .help-crumb {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.45rem;
        margin: 0.2rem 0 1.1rem;
        font-size: clamp(12px, 1.5vw, 13px);
        color: var(--muted);
    }
    .help-crumb a {
        color: var(--muted);
        text-decoration: none;
        transition: color 0.2s ease;
    }
    .help-crumb a:hover { color: var(--deep-rose); }
    .help-crumb i { font-size: 12px; opacity: 0.7; }

    /* ── Hero band ── */
    .help-hero-band {
        position: relative;
        overflow: hidden;
        border-radius: clamp(16px, 2.5vw, 24px);
        margin-bottom: clamp(1.15rem, 2.5vw, 1.85rem);
        padding: clamp(1.35rem, 3.5vw, 2.85rem) clamp(1.1rem, 3vw, 2.6rem);
        background:
            linear-gradient(135deg, rgba(44, 37, 32, 0.94) 0%, rgba(107, 52, 68, 0.92) 48%, rgba(181, 68, 90, 0.88) 100%);
        box-shadow:
            0 6px 18px rgba(42, 35, 30, 0.14),
            0 14px 32px rgba(42, 35, 30, 0.12),
            inset 0 1px 0 rgba(255, 255, 255, 0.18);
        color: #fffdf9;
    }
    .help-hero-band::before {
        content: '';
        position: absolute;
        inset: 0;
        background:
            radial-gradient(ellipse 55% 80% at 100% 0%, rgba(242, 196, 206, 0.35), transparent 55%),
            radial-gradient(ellipse 40% 60% at 0% 100%, rgba(122, 158, 126, 0.18), transparent 50%);
        pointer-events: none;
    }
    .help-hero-band::after {
        content: '';
        position: absolute;
        width: clamp(100px, 16vw, 180px);
        height: clamp(100px, 16vw, 180px);
        right: -30px; bottom: -50px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.12);
        pointer-events: none;
    }
    .help-hero-inner {
        position: relative;
        z-index: 1;
        max-width: min(36rem, 100%);
    }
    .help-kicker {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        font-family: var(--font-sans);
        font-size: clamp(10px, 1.2vw, 11px);
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: rgba(255, 253, 249, 0.72);
        margin-bottom: 0.75rem;
    }
    .help-kicker i { color: var(--blush); font-size: 14px; }
    .help-hero-band h1 {
        font-family: var(--font-display);
        font-size: clamp(1.85rem, 4.2vw, 3.35rem);
        font-weight: 500;
        letter-spacing: -0.02em;
        line-height: 1.1;
        margin: 0 0 0.7rem;
        color: #fffdf9;
        overflow-wrap: anywhere;
        word-break: break-word;
    }
    .help-hero-band h1 em {
        font-family: var(--font-serif);
        font-style: italic;
        font-weight: 400;
        color: var(--blush);
    }
    .help-hero-band p {
        margin: 0;
        font-size: clamp(0.92rem, 1.5vw, 1.05rem);
        line-height: 1.55;
        color: rgba(255, 253, 249, 0.78);
    }
    .help-hero-band p a {
        color: #fff;
        font-weight: 600;
        text-decoration: underline;
        text-underline-offset: 3px;
    }

    /* ── Glass panels & cards ── */
    .help-panel {
        position: relative;
        background: rgba(255, 253, 249, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.72);
        border-radius: var(--radius-lg);
        padding: clamp(1.15rem, 2.2vw, 1.65rem) clamp(1.1rem, 2.2vw, 1.7rem) clamp(1.15rem, 2.2vw, 1.65rem) clamp(1.2rem, 2.4vw, 1.75rem);
        /* Tighter shadow — less side “halo” that looked like a cut margin */
        box-shadow:
            0 2px 8px rgba(42, 35, 30, 0.05),
            0 10px 24px rgba(42, 35, 30, 0.06),
            inset 0 1px 0 rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(18px) saturate(1.35);
        -webkit-backdrop-filter: blur(18px) saturate(1.35);
        overflow: visible;
        box-sizing: border-box;
        width: 100%;
    }
    .help-panel + .help-panel { margin-top: clamp(0.85rem, 1.5vw, 1.1rem); }
    .help-panel::before {
        content: '';
        position: absolute;
        left: 0; top: 14px; bottom: 14px;
        width: 3px;
        border-radius: 0 4px 4px 0;
        background: linear-gradient(180deg, var(--blush), var(--deep-rose));
        opacity: 0.85;
        pointer-events: none;
        z-index: 1;
    }
    .help-panel-head {
        display: flex;
        align-items: flex-start;
        gap: clamp(0.65rem, 1.5vw, 0.9rem);
        margin-bottom: 0.75rem;
    }
    .help-panel-icon {
        flex-shrink: 0;
        width: clamp(40px, 5vw, 44px);
        height: clamp(40px, 5vw, 44px);
        border-radius: 14px;
        display: grid;
        place-items: center;
        background: linear-gradient(145deg, rgba(242, 196, 206, 0.7), rgba(212, 120, 138, 0.35));
        color: var(--deep-rose);
        font-size: 1.3rem;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7);
    }
    .help-panel h2 {
        font-family: var(--font-display);
        font-size: clamp(1.35rem, 2.4vw, 1.7rem);
        font-weight: 500;
        color: var(--charcoal);
        margin: 0;
        letter-spacing: -0.015em;
        line-height: 1.2;
        overflow-wrap: anywhere;
    }
    .help-panel .panel-lead {
        margin: 0.15rem 0 0;
        font-size: clamp(0.82rem, 1.4vw, 0.9rem);
        color: var(--muted);
        line-height: 1.45;
    }
    .help-panel h3 {
        font-family: var(--font-sans);
        font-size: 0.92rem;
        font-weight: 600;
        color: var(--charcoal);
        margin: 1.2rem 0 0.4rem;
        display: flex;
        align-items: center;
        gap: 0.45rem;
        flex-wrap: wrap;
    }
    .help-panel h3 i { color: var(--dusty-rose); font-size: 1.05rem; }
    .help-panel p,
    .help-panel li {
        font-size: clamp(0.9rem, 1.4vw, 0.97rem);
        line-height: 1.65;
        color: rgba(44, 37, 32, 0.78);
        overflow-wrap: anywhere;
    }
    .help-panel p { margin: 0 0 0.75rem; }
    .help-panel p:last-child { margin-bottom: 0; }
    .help-panel ul, .help-panel ol {
        margin: 0 0 0.75rem;
        padding-left: 0;
        list-style: none;
    }
    .help-panel li {
        position: relative;
        margin-bottom: 0.55rem;
        padding-left: 1.35rem;
    }
    .help-panel ul > li::before {
        content: '';
        position: absolute;
        left: 0; top: 0.55em;
        width: 7px; height: 7px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--blush), var(--deep-rose));
        box-shadow: 0 0 0 3px rgba(242, 196, 206, 0.35);
    }
    .help-panel ol { counter-reset: help-step; }
    .help-panel ol > li {
        padding-left: 2.1rem;
        counter-increment: help-step;
    }
    .help-panel ol > li::before {
        content: counter(help-step);
        position: absolute;
        left: 0; top: 0.1em;
        width: 1.45rem; height: 1.45rem;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 0.72rem;
        font-weight: 700;
        color: var(--deep-rose);
        background: rgba(242, 196, 206, 0.45);
        border: 1px solid rgba(181, 68, 90, 0.18);
    }
    .help-panel a {
        color: var(--deep-rose);
        text-decoration: none;
        font-weight: 600;
    }
    .help-panel a:hover { text-decoration: underline; text-underline-offset: 2px; }

    /* Feature grid */
    .help-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: clamp(0.75rem, 1.5vw, 1.1rem);
        margin-bottom: clamp(1rem, 2vw, 1.25rem);
    }
    .help-card {
        position: relative;
        background: rgba(255, 253, 249, 0.62);
        border: 1px solid rgba(255, 255, 255, 0.78);
        border-radius: var(--radius-lg);
        padding: clamp(1.15rem, 2vw, 1.5rem) clamp(1.1rem, 2vw, 1.45rem) clamp(1.1rem, 2vw, 1.4rem);
        box-shadow:
            0 2px 8px rgba(42, 35, 30, 0.05),
            0 10px 22px rgba(42, 35, 30, 0.06),
            inset 0 1px 0 rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(18px) saturate(1.35);
        -webkit-backdrop-filter: blur(18px) saturate(1.35);
        text-decoration: none;
        color: inherit;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        text-align: left;
        width: 100%;
        min-width: 0;
        font: inherit;
        cursor: pointer;
        overflow: hidden; /* keeps the decorative blob inside the card */
        box-sizing: border-box;
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s ease, border-color 0.3s ease;
        -webkit-tap-highlight-color: transparent;
    }
    .help-card::after {
        content: '';
        position: absolute;
        inset: auto -20% -40% auto;
        width: 120px; height: 120px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(242, 196, 206, 0.45), transparent 70%);
        pointer-events: none;
    }
    .help-card:hover {
        transform: translateY(-4px);
        border-color: rgba(181, 68, 90, 0.22);
        box-shadow:
            0 6px 16px rgba(42, 35, 30, 0.08),
            0 14px 28px rgba(42, 35, 30, 0.08);
    }
    .help-card .card-icon {
        position: relative;
        z-index: 1;
        width: clamp(44px, 5vw, 48px);
        height: clamp(44px, 5vw, 48px);
        border-radius: 16px;
        display: grid;
        place-items: center;
        background: linear-gradient(145deg, #f8d4dc, #e8a0b0);
        color: var(--deep-rose);
        font-size: 1.35rem;
        box-shadow:
            0 6px 16px rgba(181, 68, 90, 0.18),
            inset 0 1px 0 rgba(255, 255, 255, 0.75);
    }
    .help-card.help-card--sage .card-icon {
        background: linear-gradient(145deg, #c9dccb, #9fbfa2);
        color: var(--deep-sage);
        box-shadow:
            0 6px 16px rgba(74, 107, 78, 0.16),
            inset 0 1px 0 rgba(255, 255, 255, 0.75);
    }
    .help-card h3 {
        position: relative;
        z-index: 1;
        font-family: var(--font-display);
        font-size: clamp(1.25rem, 2.2vw, 1.5rem);
        font-weight: 500;
        margin: 0.15rem 0 0;
        color: var(--charcoal);
    }
    .help-card p {
        position: relative;
        z-index: 1;
        margin: 0;
        font-size: clamp(0.85rem, 1.4vw, 0.92rem);
        line-height: 1.5;
        color: var(--muted);
        overflow-wrap: anywhere;
    }
    .help-card .card-action {
        position: relative;
        z-index: 1;
        margin-top: 0.45rem;
        font-size: 0.82rem;
        font-weight: 600;
        color: var(--deep-rose);
        letter-spacing: 0.02em;
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
        max-width: 100%;
        overflow-wrap: anywhere;
    }
    .help-card--sage .card-action { color: var(--deep-sage); }

    /* Highlight strip */
    .help-highlight {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: clamp(0.55rem, 1.2vw, 0.85rem);
        margin: 0 0 clamp(1rem, 2vw, 1.25rem);
    }
    .help-chip {
        background: rgba(255, 253, 249, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.7);
        border-radius: var(--radius-md);
        padding: clamp(0.75rem, 1.5vw, 1rem) clamp(0.7rem, 1.4vw, 1rem);
        text-align: center;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        box-shadow: 0 2px 10px rgba(42, 35, 30, 0.05);
        min-width: 0;
        box-sizing: border-box;
    }
    .help-chip i {
        display: block;
        font-size: clamp(1.15rem, 2vw, 1.4rem);
        color: var(--deep-rose);
        margin-bottom: 0.35rem;
    }
    .help-chip strong {
        display: block;
        font-family: var(--font-display);
        font-size: clamp(1rem, 1.8vw, 1.2rem);
        font-weight: 500;
        color: var(--charcoal);
        margin-bottom: 0.15rem;
        overflow-wrap: anywhere;
    }
    .help-chip span {
        font-size: clamp(0.72rem, 1.2vw, 0.8rem);
        color: var(--muted);
        line-height: 1.35;
        display: block;
    }

    /* Help nav */
    .help-nav {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-top: clamp(1.5rem, 3vw, 2.35rem);
        padding: clamp(0.75rem, 1.5vw, 1.05rem);
        border-radius: var(--radius-lg);
        background: rgba(255, 253, 249, 0.45);
        border: 1px solid rgba(255, 255, 255, 0.7);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        box-sizing: border-box;
        width: 100%;
    }
    .help-nav a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.4rem;
        padding: 0.55rem 1rem;
        min-height: 40px;
        border-radius: var(--radius-pill);
        font-size: clamp(0.78rem, 1.3vw, 0.86rem);
        font-weight: 500;
        color: var(--charcoal);
        text-decoration: none;
        background: rgba(255, 255, 255, 0.55);
        border: 1px solid rgba(107, 76, 59, 0.1);
        transition: var(--transition);
        box-sizing: border-box;
    }
    .help-nav a i { font-size: 1rem; color: var(--dusty-rose); }
    .help-nav a:hover,
    .help-nav a.is-active {
        background: linear-gradient(135deg, rgba(242, 196, 206, 0.55), rgba(212, 120, 138, 0.28));
        border-color: rgba(181, 68, 90, 0.25);
        color: var(--deep-rose);
        box-shadow: 0 4px 14px rgba(181, 68, 90, 0.12);
    }
    .help-nav a.is-active { font-weight: 600; }

    /* FAQ */
    .faq-list { display: flex; flex-direction: column; gap: 0.75rem; width: 100%; }
    .faq-item {
        background: rgba(255, 253, 249, 0.58);
        border: 1px solid rgba(255, 255, 255, 0.75);
        border-radius: var(--radius-md);
        box-shadow:
            0 2px 8px rgba(42, 35, 30, 0.05),
            0 8px 20px rgba(42, 35, 30, 0.05),
            inset 0 1px 0 rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(14px) saturate(1.25);
        -webkit-backdrop-filter: blur(14px) saturate(1.25);
        overflow: hidden;
        width: 100%;
        box-sizing: border-box;
        transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }
    .faq-item[open] {
        border-color: rgba(181, 68, 90, 0.2);
        box-shadow:
            0 3px 10px rgba(42, 35, 30, 0.06),
            0 10px 22px rgba(42, 35, 30, 0.06);
    }
    .faq-item summary {
        list-style: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.85rem;
        padding: clamp(0.95rem, 2vw, 1.15rem) clamp(0.95rem, 2vw, 1.25rem);
        font-family: var(--font-display);
        font-size: clamp(1.02rem, 2vw, 1.2rem);
        font-weight: 500;
        color: var(--charcoal);
        user-select: none;
        min-width: 0;
    }
    .faq-item summary > span:first-child {
        min-width: 0;
        flex: 1;
        overflow-wrap: anywhere;
        word-break: break-word;
    }
    .faq-item summary::-webkit-details-marker { display: none; }
    .faq-item summary .faq-plus {
        flex-shrink: 0;
        width: 30px; height: 30px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: rgba(242, 196, 206, 0.4);
        color: var(--deep-rose);
        font-size: 1.05rem;
        transition: transform 0.3s ease, background 0.25s ease;
    }
    .faq-item[open] summary .faq-plus {
        transform: rotate(45deg);
        background: linear-gradient(135deg, var(--dusty-rose), var(--deep-rose));
        color: #fff;
    }
    .faq-item .faq-answer {
        padding: 0 clamp(0.95rem, 2vw, 1.25rem) clamp(1rem, 2vw, 1.25rem);
        font-size: clamp(0.88rem, 1.5vw, 0.96rem);
        line-height: 1.65;
        color: rgba(44, 37, 32, 0.78);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        border-top: 1px solid rgba(107, 76, 59, 0.06);
        margin-top: -0.15rem;
        padding-top: 0.9rem;
    }

    /* Contact form */
    .contact-form {
        display: grid;
        gap: 0.95rem;
        margin-top: 0.5rem;
        width: 100%;
    }
    .contact-form label {
        display: block;
        font-size: 11px;
        font-weight: 700;
        color: var(--muted);
        margin-bottom: 0.35rem;
        letter-spacing: 0.07em;
        text-transform: uppercase;
    }
    .contact-form input,
    .contact-form textarea,
    .contact-form select {
        width: 100%;
        max-width: 100%;
        padding: 0.78rem 0.95rem;
        border: 1px solid rgba(107, 76, 59, 0.14);
        border-radius: var(--radius-md);
        font-family: var(--font-sans);
        font-size: 16px; /* avoid iOS zoom on focus */
        background: rgba(255, 255, 255, 0.78);
        color: var(--charcoal);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9);
        transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        box-sizing: border-box;
    }
    .contact-form input:focus,
    .contact-form textarea:focus,
    .contact-form select:focus {
        outline: none;
        border-color: rgba(194, 78, 104, 0.45);
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 0 0 3px rgba(194, 78, 104, 0.12);
    }
    .contact-form textarea { min-height: 140px; resize: vertical; }
    .contact-form .form-row {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.9rem;
    }
    .contact-form .btn-send {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.45rem;
        width: fit-content;
        max-width: 100%;
        min-height: 44px;
        padding: 0.82rem 1.5rem;
        border: none;
        border-radius: var(--radius-pill);
        background: linear-gradient(135deg, var(--dusty-rose), var(--deep-rose));
        color: #fff;
        font-family: var(--font-sans);
        font-size: 0.92rem;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 8px 22px rgba(181, 68, 90, 0.28);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .contact-form .btn-send:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 28px rgba(181, 68, 90, 0.36);
    }

    /* ══════════ Responsive breakpoints ══════════ */
