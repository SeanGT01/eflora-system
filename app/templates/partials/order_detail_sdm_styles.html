{# Raw CSS included inside parent <style> blocks #}
/* ══ Shared: minimalist order / basket detail modal (sdm) ══ */

.modal.order-details-modal-surface {
    max-width: min(720px, 92vw);
    width: 100%;
    max-height: 88vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    border-radius: 16px;
    border: 1px solid rgba(255, 255, 255, 0.7);
    box-shadow: 0 24px 48px rgba(90, 40, 80, 0.14);
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(16px) saturate(1.2);
    -webkit-backdrop-filter: blur(16px) saturate(1.2);
}

.custom-modal-dialog.order-details-modal-surface {
    width: min(720px, 100%);
    max-height: 88vh;
    border-radius: 16px;
    border: 1px solid rgba(255, 255, 255, 0.7);
    box-shadow: 0 24px 48px rgba(90, 40, 80, 0.14);
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(16px) saturate(1.2);
    -webkit-backdrop-filter: blur(16px) saturate(1.2);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.order-details-modal-surface .modal-header,
.order-details-modal-surface .custom-modal-head {
    padding: 1rem 1.25rem;
    border-bottom: 1px solid rgba(44, 37, 32, 0.06);
    background: transparent;
    flex-shrink: 0;
    position: relative;
}

.order-details-modal-surface .modal-header h3,
.order-details-modal-surface .modal-title,
.order-details-modal-surface .custom-modal-head .modal-title {
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--charcoal);
    margin: 0;
    font-family: var(--font-sans);
}

.order-details-modal-surface .modal-body,
.order-details-modal-surface .custom-modal-body {
    padding: 1rem 1.25rem 1.25rem;
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    max-height: none;
    min-height: 0;
}

.order-details-modal-surface .modal-footer,
.order-details-modal-surface .custom-modal-foot {
    padding: 0.85rem 1.25rem 1.1rem;
    border-top: 1px solid rgba(44, 37, 32, 0.06);
    background: transparent;
    flex-shrink: 0;
    position: relative;
}

.order-details-modal-surface .cart-close,
.order-details-modal-surface .modal-close {
    border: none;
    background: rgba(44, 37, 32, 0.06);
    color: var(--charcoal);
    border-radius: 50%;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
}

.order-details-modal-surface .cart-close:hover,
.order-details-modal-surface .modal-close:hover {
    background: rgba(44, 37, 32, 0.1);
    color: var(--deep-rose);
}

.order-details-modal-surface .custom-close {
    border: none;
    background: rgba(44, 37, 32, 0.06);
    color: var(--charcoal);
    border-radius: 50%;
    width: 32px;
    height: 32px;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
}

.order-details-modal-surface .custom-close:hover {
    background: rgba(44, 37, 32, 0.1);
    color: var(--deep-rose);
}

.sdm {
    display: flex;
    flex-direction: column;
    gap: 1.35rem;
}

.sdm-topbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem 1rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid rgba(44, 37, 32, 0.07);
}

.sdm-topbar-left {
    display: flex;
    align-items: center;
    gap: 0.65rem;
    flex-wrap: wrap;
}

.sdm-oid {
    font-family: var(--font-display, Georgia, serif);
    font-size: 1.35rem;
    font-weight: 500;
    color: var(--charcoal);
    letter-spacing: -0.02em;
}

.sdm-when {
    font-size: 12px;
    color: var(--muted);
    font-weight: 500;
}

.sdm-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 1.25rem 1.75rem;
}

.sdm-block {
    min-width: 0;
}

.sdm-block h4 {
    margin: 0 0 0.45rem;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
}

.sdm-rows {
    display: flex;
    flex-direction: column;
    gap: 0;
}

.sdm-row {
    display: grid;
    grid-template-columns: minmax(4.5rem, 32%) 1fr;
    gap: 0.35rem 0.65rem;
    padding: 0.4rem 0;
    font-size: 13px;
    line-height: 1.45;
    border-bottom: 1px solid rgba(44, 37, 32, 0.05);
}

.sdm-row:last-child {
    border-bottom: none;
    padding-bottom: 0;
}

.sdm-k {
    color: var(--muted);
    font-size: 12px;
}

.sdm-v {
    color: var(--charcoal);
    word-break: break-word;
}

.sdm-v--success {
    color: var(--deep-sage);
    font-weight: 600;
}

.sdm-block--full {
    width: 100%;
}

.sdm .order-progress {
    margin: 0.65rem 0 0.35rem;
}

.sdm-item-rows {
    border: 1px solid rgba(44, 37, 32, 0.07);
    border-radius: 10px;
    overflow: hidden;
    background: #fff;
}

.sdm-item-rows .order-item-row {
    margin-bottom: 0;
    border-radius: 0;
    border-bottom: 1px solid rgba(44, 37, 32, 0.05);
    background: transparent;
}

.sdm-item-rows .order-item-row:last-child {
    border-bottom: none;
}

.sdm-table-wrap {
    margin-top: 0.35rem;
    border-radius: 10px;
    border: 1px solid rgba(44, 37, 32, 0.07);
    overflow: hidden;
    background: #fff;
}

.sdm-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
}

.sdm-table th {
    text-align: left;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 0.5rem 0.75rem;
    background: rgba(44, 37, 32, 0.03);
    border-bottom: 1px solid rgba(44, 37, 32, 0.06);
}

.sdm-table td {
    padding: 0.55rem 0.75rem;
    border-bottom: 1px solid rgba(44, 37, 32, 0.05);
    vertical-align: top;
}

.sdm-table tbody tr:last-child td {
    border-bottom: none;
}

.sdm-table tfoot td {
    border-bottom: 1px solid rgba(44, 37, 32, 0.06);
    background: rgba(44, 37, 32, 0.02);
    font-size: 13px;
}

.sdm-table tfoot tr:last-child td {
    border-bottom: none;
    background: rgba(44, 37, 32, 0.04);
}

.sdm-row--total {
    border-bottom: none !important;
    padding-top: 0.5rem !important;
    margin-top: 0.25rem;
    border-top: 1px dashed rgba(44, 37, 32, 0.12);
}

.sdm-row--total .sdm-k {
    font-family: var(--font-display, Georgia, serif);
    font-size: 15px;
    font-weight: 500;
    color: var(--charcoal);
}

.sdm-row--total .sdm-v {
    font-family: var(--font-display, Georgia, serif);
    font-size: 1.35rem;
    font-weight: 600;
    color: var(--deep-rose);
}

.sdm-proofs {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 1rem;
    margin-top: 0.35rem;
}

.sdm-proof-fig {
    margin: 0;
}

.sdm-proof-fig img {
    display: block;
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    border-radius: 10px;
    background: var(--cream);
}

.sdm-proof-cap {
    font-size: 11px;
    color: var(--muted);
    margin-top: 0.4rem;
    font-weight: 500;
    line-height: 1.3;
}

/* Tiny product preview in tables / line lists */
.sdm-line-thumb-cell {
    width: 36px;
    max-width: 36px;
    padding: 0.4rem 0.3rem 0.4rem 0.5rem !important;
    vertical-align: middle;
}
.sdm-line-thumb {
    width: 24px;
    height: 24px;
    border-radius: 4px;
    object-fit: cover;
    display: block;
    background: var(--cream);
    border: 1px solid rgba(44, 37, 32, 0.08);
}
.sdm-line-thumb-ph {
    width: 24px;
    height: 24px;
    border-radius: 4px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(145deg, #f5ede6, #ede3d8);
    color: rgba(107, 76, 59, 0.22);
    font-size: 10px;
    border: 1px solid rgba(44, 37, 32, 0.06);
}

.sdm-item-rows .order-item-img,
.sdm-item-rows .order-item-img-ph {
    width: 28px;
    height: 28px;
    min-width: 28px;
    border-radius: 6px;
}

@media (max-width: 1100px) {
    .modal.order-details-modal-surface,
    .custom-modal-dialog.order-details-modal-surface {
        max-width: min(640px, 94vw);
        max-height: min(90vh, 820px);
    }

    .order-details-modal-surface .modal-header,
    .order-details-modal-surface .custom-modal-head,
    .order-details-modal-surface .modal-body,
    .order-details-modal-surface .custom-modal-body,
    .order-details-modal-surface .modal-footer,
    .order-details-modal-surface .custom-modal-foot {
        padding-left: 1.1rem;
        padding-right: 1.1rem;
    }

    .sdm {
        gap: 1.15rem;
    }
}

@media (max-width: 700px) {
    .sdm-grid {
        grid-template-columns: 1fr;
        gap: 1.15rem;
    }

    .modal.order-details-modal-surface,
    .custom-modal-dialog.order-details-modal-surface {
        max-width: 100%;
        max-height: min(92vh, 100%);
        border-radius: 16px 16px 0 0;
    }

    .order-details-modal-surface .modal-header,
    .order-details-modal-surface .custom-modal-head {
        padding: 0.9rem 1rem;
    }

    .order-details-modal-surface .modal-body,
    .order-details-modal-surface .custom-modal-body {
        padding: 0.85rem 1rem calc(1rem + env(safe-area-inset-bottom, 0px));
    }

    .sdm-topbar {
        gap: 0.5rem 0.75rem;
    }

    .sdm-proofs {
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        gap: 0.75rem;
    }

    .oi-bd-row {
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 2px 8px;
    }

    .oi-bd-calc {
        display: none;
    }
}

@media (max-width: 420px) {
    .sdm-when {
        font-size: 11px;
        width: 100%;
    }

    .sdm-row {
        gap: 0.5rem;
    }

    .sdm-row .sdm-k,
    .sdm-row .sdm-v {
        font-size: 12px;
    }
}
