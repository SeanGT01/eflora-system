{% macro help_shell_open() %}
<div class="help-atmosphere">
    {% include "partials/white_florals.html" %}
    <div class="help-glow help-glow--1" aria-hidden="true"></div>
    <div class="help-glow help-glow--2" aria-hidden="true"></div>
    <div class="help-page">
{% endmacro %}

{% macro help_shell_close() %}
    </div>
</div>
{% endmacro %}

{% macro help_nav(active='') %}
<nav class="help-nav" aria-label="Help pages">
    <a href="{{ url_for('templates.contact') }}" class="{{ 'is-active' if active == 'contact' else '' }}"><i class="ri-customer-service-2-line"></i> Contact Us</a>
    <a href="{{ url_for('templates.faq') }}" class="{{ 'is-active' if active == 'faq' else '' }}"><i class="ri-question-answer-line"></i> FAQ</a>
    <a href="{{ url_for('templates.shipping') }}" class="{{ 'is-active' if active == 'shipping' else '' }}"><i class="ri-truck-line"></i> Shipping</a>
    <a href="{{ url_for('templates.returns') }}" class="{{ 'is-active' if active == 'returns' else '' }}"><i class="ri-arrow-go-back-line"></i> Returns</a>
</nav>
{% endmacro %}
