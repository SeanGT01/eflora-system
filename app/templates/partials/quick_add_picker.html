{# Shared quick-add picker (Standard + variants). Expects quick_add_products or products. #}
<style>
    /* ─── Quick-add variant picker ─── */
    .qa-overlay {
        position: fixed;
        inset: 0;
        z-index: 520;
        background: rgba(44, 37, 32, 0.38);
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity 0.22s ease, visibility 0.22s ease;
        -webkit-backdrop-filter: blur(2px);
        backdrop-filter: blur(2px);
    }
    .qa-overlay.open {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
    }

    .qa-picker {
        position: fixed;
        z-index: 530;
        width: min(340px, calc(100vw - 1.5rem));
        max-height: min(78vh, 560px);
        display: flex;
        flex-direction: column;
        background: #fffdf9;
        border: 1px solid rgba(107, 76, 59, 0.14);
        border-radius: 20px;
        box-shadow: 0 18px 48px rgba(44, 37, 32, 0.22);
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transform: translateY(8px) scale(0.98);
        transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s ease;
        overflow: hidden;
    }
    .qa-picker.open {
        opacity: 1 !important;
        visibility: visible !important;
        pointer-events: auto;
        transform: translateY(0) scale(1);
    }

    .qa-picker-head {
        display: flex;
        gap: 0.85rem;
        align-items: flex-start;
        padding: 1rem 1rem 0.85rem;
        border-bottom: 1px solid rgba(107, 76, 59, 0.1);
        background: linear-gradient(180deg, rgba(250, 246, 240, 0.95), rgba(255, 253, 249, 0.7));
    }
    .qa-picker-img {
        width: 64px;
        height: 64px;
        border-radius: 14px;
        object-fit: cover;
        background: linear-gradient(145deg, #f5ede6, #ede3d8);
        flex-shrink: 0;
    }
    .qa-picker-img-fallback {
        display: flex;
        align-items: center;
        justify-content: center;
        color: rgba(107, 76, 59, 0.28);
        font-size: 26px;
    }
    .qa-picker-meta {
        flex: 1;
        min-width: 0;
        padding-top: 0.1rem;
    }
    .qa-picker-store {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--dusty-rose, #d4788a);
        margin-bottom: 0.2rem;
    }
    .qa-picker-title {
        font-family: var(--font-display, 'Cormorant Garamond', serif);
        font-size: 1.2rem;
        font-weight: 500;
        line-height: 1.2;
        color: var(--charcoal, #2c2520);
        margin: 0;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }
    .qa-picker-close {
        width: 32px;
        height: 32px;
        border: none;
        border-radius: 50%;
        background: rgba(107, 76, 59, 0.06);
        color: var(--muted, #9a8d85);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        flex-shrink: 0;
        transition: background 0.2s ease, color 0.2s ease;
    }
    .qa-picker-close:hover {
        background: rgba(181, 68, 90, 0.12);
        color: var(--deep-rose, #b5445a);
    }

    .qa-picker-body {
        padding: 0.9rem 1rem 0.35rem;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        flex: 1;
        min-height: 0;
    }
    .qa-picker-label {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted, #9a8d85);
        margin-bottom: 0.65rem;
        display: block;
    }
    .qa-option-list {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
    }
    .qa-option {
        width: 100%;
        display: grid;
        grid-template-columns: 44px 1fr auto;
        gap: 0.7rem;
        align-items: center;
        text-align: left;
        padding: 0.65rem 0.75rem;
        border: 1.5px solid rgba(230, 170, 195, 0.4);
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.7);
        cursor: pointer;
        transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
        font-family: var(--font-sans, 'DM Sans', sans-serif);
        color: var(--charcoal, #2c2520);
    }
    .qa-option:hover:not(:disabled) {
        border-color: rgba(216, 120, 160, 0.65);
        background: rgba(255, 255, 255, 0.95);
    }
    .qa-option.active {
        border-color: transparent;
        background: linear-gradient(135deg, rgba(194, 78, 104, 0.12), rgba(176, 112, 200, 0.12));
        box-shadow: 0 0 0 1.5px #c24e68, 0 6px 16px rgba(181, 68, 90, 0.12);
    }
    .qa-option:disabled {
        opacity: 0.48;
        cursor: not-allowed;
    }
    .qa-option-thumb {
        width: 44px;
        height: 44px;
        border-radius: 10px;
        object-fit: cover;
        background: linear-gradient(145deg, #f5ede6, #ede3d8);
    }
    .qa-option-thumb-fallback {
        display: flex;
        align-items: center;
        justify-content: center;
        color: rgba(107, 76, 59, 0.25);
        font-size: 18px;
    }
    .qa-option-info { min-width: 0; }
    .qa-option-name {
        font-size: 13.5px;
        font-weight: 600;
        line-height: 1.25;
        margin-bottom: 0.15rem;
    }
    .qa-option-stock {
        font-size: 11px;
        color: var(--muted, #9a8d85);
    }
    .qa-option-stock.out { color: #c0392b; }
    .qa-option-price {
        font-family: var(--font-display, 'Cormorant Garamond', serif);
        font-size: 1.05rem;
        font-weight: 600;
        color: var(--deep-rose, #b5445a);
        text-align: right;
        white-space: nowrap;
    }
    .qa-option-price .was {
        display: block;
        font-size: 0.72rem;
        font-family: var(--font-sans, 'DM Sans', sans-serif);
        font-weight: 500;
        color: #9e9e9e;
        text-decoration: line-through;
    }

    .qa-picker-foot {
        padding: 0.85rem 1rem 1rem;
        border-top: 1px solid rgba(107, 76, 59, 0.1);
        background: var(--warm-white, #fffdf9);
    }
    .qa-foot-row {
        display: flex;
        align-items: center;
        gap: 0.65rem;
    }
    .qa-qty-control {
        display: inline-flex;
        align-items: center;
        flex-shrink: 0;
        border: 1.5px solid rgba(230, 170, 195, 0.45);
        border-radius: 14px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.72);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.75);
    }
    .qa-qty-btn {
        width: 40px;
        height: 44px;
        border: none;
        background: transparent;
        color: var(--charcoal, #3d2f2f);
        font-size: 1.1rem;
        font-weight: 600;
        line-height: 1;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: background 0.15s ease, color 0.15s ease;
    }
    .qa-qty-btn:hover:not(:disabled) {
        background: rgba(255, 190, 210, 0.18);
        color: var(--deep-rose, #b5445a);
    }
    .qa-qty-btn:disabled {
        color: rgba(107, 76, 59, 0.28);
        cursor: default;
    }
    .qa-qty-value {
        min-width: 36px;
        height: 44px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-left: 1.5px solid rgba(230, 170, 195, 0.3);
        border-right: 1.5px solid rgba(230, 170, 195, 0.3);
        font-family: var(--font-display, 'Cormorant Garamond', Georgia, serif);
        font-size: 1.15rem;
        font-weight: 600;
        color: var(--charcoal, #3d2f2f);
        user-select: none;
    }
    .qa-add-btn {
        flex: 1;
        min-width: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.45rem;
        padding: 0.85rem 1rem;
        border: none;
        border-radius: 999px;
        background: linear-gradient(135deg, #c24e68 0%, #d878a0 55%, #b070c8 100%);
        color: #fff;
        font-family: var(--font-sans, 'DM Sans', sans-serif);
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 8px 18px rgba(181, 68, 90, 0.28);
        transition: transform 0.18s ease, filter 0.18s ease;
    }
    .qa-add-btn:hover:not(:disabled) {
        filter: brightness(1.03);
        transform: translateY(-1px);
    }
    .qa-add-btn:disabled {
        opacity: 0.55;
        cursor: not-allowed;
        box-shadow: none;
        transform: none;
    }

    @media (max-width: 900px) {
        .qa-picker { width: min(360px, calc(100vw - 1.25rem)); }
    }

    @media (max-width: 640px) {
        .qa-picker {
            left: 0 !important;
            right: 0 !important;
            bottom: 0 !important;
            top: auto !important;
            width: 100% !important;
            max-width: 100%;
            max-height: min(86vh, 640px);
            border-radius: 22px 22px 0 0;
            transform: translateY(24px);
        }
        .qa-picker.open { transform: translateY(0); }
        .qa-picker-head { padding: 1.1rem 1.1rem 0.9rem; }
        .qa-picker-body { padding: 0.95rem 1.1rem 0.4rem; }
        .qa-picker-foot {
            padding: 0.9rem 1.1rem calc(1rem + env(safe-area-inset-bottom, 0px));
        }
        .qa-foot-row { gap: 0.55rem; }
        .qa-qty-btn {
            width: 38px;
            height: 46px;
        }
        .qa-qty-value {
            min-width: 34px;
            height: 46px;
            font-size: 1.2rem;
        }
        .qa-add-btn {
            padding: 0.9rem 0.85rem;
            font-size: 13.5px;
        }
        .qa-option {
            grid-template-columns: 48px 1fr auto;
            padding: 0.75rem;
        }
    }
</style>

{# Quick-add option picker (Standard + variants) #}
<div class="qa-overlay" id="qaOverlay" onclick="closeQuickAddPicker()" aria-hidden="true"></div>
<div class="qa-picker" id="qaPicker" role="dialog" aria-modal="true" aria-labelledby="qaPickerTitle" hidden>
    <div class="qa-picker-head">
        <div class="qa-picker-img qa-picker-img-fallback" id="qaPickerImgWrap" aria-hidden="true">
            <i class="ri-image-line"></i>
        </div>
        <div class="qa-picker-meta">
            <div class="qa-picker-store" id="qaPickerStore">Flower Shop</div>
            <h3 class="qa-picker-title" id="qaPickerTitle">Product</h3>
        </div>
        <button type="button" class="qa-picker-close" onclick="closeQuickAddPicker()" aria-label="Close">
            <i class="ri-close-line"></i>
        </button>
    </div>
    <div class="qa-picker-body">
        <span class="qa-picker-label">Select option</span>
        <div class="qa-option-list" id="qaOptionList"></div>
    </div>
    <div class="qa-picker-foot">
        <div class="qa-foot-row">
            <div class="qa-qty-control" role="group" aria-label="Quantity">
                <button type="button" class="qa-qty-btn" id="qaQtyMinus" onclick="changeQuickAddQty(-1)" aria-label="Decrease quantity" disabled>−</button>
                <span class="qa-qty-value" id="qaQtyValue" aria-live="polite">1</span>
                <button type="button" class="qa-qty-btn" id="qaQtyPlus" onclick="changeQuickAddQty(1)" aria-label="Increase quantity">+</button>
            </div>
            <button type="button" class="qa-add-btn" id="qaConfirmBtn" onclick="confirmQuickAdd()">
                <i class="ri-shopping-bag-line"></i>
                <span id="qaConfirmLabel">Add to basket</span>
            </button>
        </div>
    </div>
</div>

<script type="application/json" id="quickAddProductsData">{{ quick_add_products|default(products)|tojson }}</script>
<script>
// Quick-add option picker (Standard + variants)
(function () {
    let qaProductsById = {};
    let qaCurrentProduct = null;
    let qaSelectedKey = 'main';
    let qaQty = 1;
    let qaAnchorEl = null;
    let qaRepositionBound = null;
    let qaAdding = false;

    function loadHomeProductsMap() {
        const el = document.getElementById('homeProductsQuickAdd')
            || document.getElementById('quickAddProductsData');
        if (!el) return;
        try {
            const list = JSON.parse(el.textContent || '[]');
            qaProductsById = {};
            (list || []).forEach(function (p) {
                if (p && p.id != null) qaProductsById[String(p.id)] = p;
            });
        } catch (e) {
            console.error('Failed to parse products for quick add', e);
            qaProductsById = {};
        }
    }

    function qaMoney(n) {
        const num = Number(n);
        if (!Number.isFinite(num)) return '₱0';
        const formatted = (typeof window.formatMoneyValue === 'function')
            ? window.formatMoneyValue(num)
            : num.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
        return '₱' + formatted;
    }

    function qaEscape(str) {
        return String(str == null ? '' : str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    function qaThumbHtml(url) {
        if (url) {
            return '<img class="qa-option-thumb" src="' + qaEscape(url) + '" alt="" onerror="this.outerHTML=\'<div class=&quot;qa-option-thumb qa-option-thumb-fallback&quot;><i class=&quot;ri-image-line&quot;></i></div>\'">';
        }
        return '<div class="qa-option-thumb qa-option-thumb-fallback"><i class="ri-image-line"></i></div>';
    }

    function qaPriceHtml(effective, regular) {
        const eff = Number(effective);
        const reg = Number(regular);
        if (Number.isFinite(reg) && Number.isFinite(eff) && reg > eff) {
            return '<div class="qa-option-price"><span class="was">' + qaMoney(reg) + '</span>' + qaMoney(eff) + '</div>';
        }
        return '<div class="qa-option-price">' + qaMoney(Number.isFinite(eff) ? eff : reg) + '</div>';
    }

    function buildOptions(product) {
        const options = [];
        const mainStock = Number(product.stock_quantity) || 0;
        const mainEff = product.effective_price != null ? product.effective_price : product.price;
        options.push({
            key: 'main',
            variant_id: null,
            name: 'Standard',
            price: mainEff,
            regular_price: product.price,
            stock: mainStock,
            image_url: product.image_url || product.thumbnail_url || '',
            in_stock: product.is_available !== false && mainStock > 0
        });

        (product.variants || []).forEach(function (v) {
            if (!v || v.is_available === false) return;
            const stock = Number(v.stock_quantity) || 0;
            const eff = v.effective_price != null ? v.effective_price : v.price;
            options.push({
                key: 'v-' + v.id,
                variant_id: v.id,
                name: v.name || 'Option',
                price: eff,
                regular_price: v.price,
                stock: stock,
                image_url: v.image_url || product.image_url || '',
                in_stock: stock > 0
            });
        });
        return options;
    }

    function renderPicker(product) {
        const storeEl = document.getElementById('qaPickerStore');
        const titleEl = document.getElementById('qaPickerTitle');
        const imgWrap = document.getElementById('qaPickerImgWrap');
        const listEl = document.getElementById('qaOptionList');

        storeEl.textContent = product.store_name || 'Flower Shop';
        titleEl.textContent = product.name || 'Product';

        if (product.image_url) {
            imgWrap.className = 'qa-picker-img';
            imgWrap.innerHTML = '<img class="qa-picker-img" src="' + qaEscape(product.image_url) + '" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:14px;" onerror="this.parentElement.className=\'qa-picker-img qa-picker-img-fallback\';this.parentElement.innerHTML=\'<i class=\\\'ri-image-line\\\'></i>\';">';
        } else {
            imgWrap.className = 'qa-picker-img qa-picker-img-fallback';
            imgWrap.innerHTML = '<i class="ri-image-line"></i>';
        }

        const options = buildOptions(product);
        const firstInStock = options.find(function (o) { return o.in_stock; });
        qaSelectedKey = firstInStock ? firstInStock.key : (options[0] ? options[0].key : 'main');

        listEl.innerHTML = options.map(function (opt) {
            const active = opt.key === qaSelectedKey ? ' active' : '';
            const disabled = opt.in_stock ? '' : ' disabled';
            const stockText = opt.in_stock
                ? (opt.stock + ' available')
                : 'Out of stock';
            const stockClass = opt.in_stock ? '' : ' out';
            return (
                '<button type="button" class="qa-option' + active + '"' + disabled +
                ' data-key="' + qaEscape(opt.key) + '"' +
                ' onclick="selectQuickAddOption(this)">' +
                qaThumbHtml(opt.image_url) +
                '<div class="qa-option-info">' +
                '<div class="qa-option-name">' + qaEscape(opt.name) + '</div>' +
                '<div class="qa-option-stock' + stockClass + '">' + stockText + '</div>' +
                '</div>' +
                qaPriceHtml(opt.price, opt.regular_price) +
                '</button>'
            );
        }).join('');

        const selected = options.find(function (o) { return o.key === qaSelectedKey; });
        qaQty = 1;
        syncQuickAddQtyUI(selected);
        updateQuickAddConfirmBtn(selected);
    }

    function getSelectedQuickAddOption() {
        if (!qaCurrentProduct) return null;
        const options = buildOptions(qaCurrentProduct);
        return options.find(function (o) { return o.key === qaSelectedKey; }) || null;
    }

    function syncQuickAddQtyUI(selected) {
        const max = (selected && selected.in_stock) ? Math.max(1, Number(selected.stock) || 1) : 1;
        if (!(selected && selected.in_stock)) {
            qaQty = 1;
        } else {
            qaQty = Math.min(Math.max(1, qaQty), max);
        }

        const valueEl = document.getElementById('qaQtyValue');
        const minusBtn = document.getElementById('qaQtyMinus');
        const plusBtn = document.getElementById('qaQtyPlus');
        if (valueEl) valueEl.textContent = String(qaQty);
        if (minusBtn) minusBtn.disabled = !(selected && selected.in_stock) || qaQty <= 1;
        if (plusBtn) plusBtn.disabled = !(selected && selected.in_stock) || qaQty >= max;
    }

    function updateQuickAddConfirmBtn(selected) {
        const confirmBtn = document.getElementById('qaConfirmBtn');
        const labelEl = document.getElementById('qaConfirmLabel');
        const enabled = !!(selected && selected.in_stock);
        if (labelEl) {
            labelEl.textContent = (enabled && qaQty > 1)
                ? ('Add ' + qaQty + ' to basket')
                : 'Add to basket';
        }
        if (confirmBtn && !qaAdding) {
            confirmBtn.disabled = !enabled;
            confirmBtn.innerHTML =
                '<i class="ri-shopping-bag-line"></i><span id="qaConfirmLabel">' +
                ((enabled && qaQty > 1) ? ('Add ' + qaQty + ' to basket') : 'Add to basket') +
                '</span>';
        }
    }

    window.changeQuickAddQty = function (delta) {
        if (qaAdding) return;
        const selected = getSelectedQuickAddOption();
        if (!selected || !selected.in_stock) return;
        const max = Math.max(1, Number(selected.stock) || 1);
        const next = Math.min(max, Math.max(1, qaQty + Number(delta || 0)));
        if (next === qaQty) return;
        qaQty = next;
        syncQuickAddQtyUI(selected);
        updateQuickAddConfirmBtn(selected);
    };

    function positionPicker(anchor) {
        const picker = document.getElementById('qaPicker');
        if (!picker || !anchor) return;

        // Never touch opacity/visibility here — that caused a transparent stuck state on desktop.
        picker.style.opacity = '';
        picker.style.visibility = '';
        picker.style.transform = '';

        if (window.matchMedia('(max-width: 640px)').matches) {
            picker.style.left = '';
            picker.style.top = '';
            picker.style.right = '';
            picker.style.bottom = '';
            picker.style.width = '';
            return;
        }

        const rect = anchor.getBoundingClientRect();
        const margin = 10;
        const width = Math.min(340, window.innerWidth - 24);
        picker.style.width = width + 'px';

        let left = rect.right - width;
        left = Math.max(12, Math.min(left, window.innerWidth - width - 12));
        picker.style.left = left + 'px';
        picker.style.right = 'auto';
        picker.style.bottom = 'auto';

        // Prefer below the button; flip above if needed.
        const height = Math.min(picker.offsetHeight || 360, window.innerHeight - 24);
        let top = rect.bottom + margin;
        if (top + height > window.innerHeight - 12) {
            top = rect.top - height - margin;
        }
        if (top < 12) top = 12;
        picker.style.top = top + 'px';
    }

    window.selectQuickAddOption = function (btn) {
        if (!btn || btn.disabled) return;
        qaSelectedKey = btn.getAttribute('data-key') || 'main';
        document.querySelectorAll('#qaOptionList .qa-option').forEach(function (el) {
            el.classList.toggle('active', el === btn);
        });
        const selected = getSelectedQuickAddOption();
        qaQty = 1;
        syncQuickAddQtyUI(selected);
        updateQuickAddConfirmBtn(selected);
    };

    window.openQuickAddPicker = function (anchorEl, productId) {
        if (!Object.keys(qaProductsById).length) loadHomeProductsMap();
        const product = qaProductsById[String(productId)];
        if (!product) {
            if (typeof showToast === 'function') showToast('Product unavailable');
            return;
        }

        qaCurrentProduct = product;
        qaAnchorEl = anchorEl || null;
        renderPicker(product);

        const overlay = document.getElementById('qaOverlay');
        const picker = document.getElementById('qaPicker');
        overlay.classList.add('open');
        overlay.setAttribute('aria-hidden', 'false');
        picker.hidden = false;
        picker.style.opacity = '';
        picker.style.visibility = '';
        picker.classList.add('open');
        if (typeof updateChatFabVisibility === 'function') updateChatFabVisibility();

        if (qaAnchorEl) {
            // Position after paint so height is accurate
            requestAnimationFrame(function () {
                positionPicker(qaAnchorEl);
            });
        } else {
            picker.style.left = '50%';
            picker.style.top = '50%';
            picker.style.transform = 'translate(-50%, -50%)';
        }

        if (!qaRepositionBound) {
            qaRepositionBound = function () {
                if (!qaAnchorEl) return;
                const p = document.getElementById('qaPicker');
                if (p && p.classList.contains('open')) positionPicker(qaAnchorEl);
            };
            window.addEventListener('resize', qaRepositionBound);
            window.addEventListener('scroll', qaRepositionBound, true);
        }

        document.addEventListener('keydown', qaOnKeydown);
    };

    function qaOnKeydown(e) {
        if (e.key === 'Escape') closeQuickAddPicker();
    }

    window.closeQuickAddPicker = function () {
        const overlay = document.getElementById('qaOverlay');
        const picker = document.getElementById('qaPicker');
        const confirmBtn = document.getElementById('qaConfirmBtn');
        if (overlay) {
            overlay.classList.remove('open');
            overlay.setAttribute('aria-hidden', 'true');
        }
        if (picker) {
            picker.classList.remove('open');
            picker.hidden = true;
            picker.style.left = '';
            picker.style.top = '';
            picker.style.right = '';
            picker.style.bottom = '';
            picker.style.width = '';
            picker.style.transform = '';
            picker.style.opacity = '';
            picker.style.visibility = '';
        }
        if (confirmBtn) {
            confirmBtn.disabled = false;
            confirmBtn.innerHTML = '<i class="ri-shopping-bag-line"></i><span id="qaConfirmLabel">Add to basket</span>';
        }
        qaCurrentProduct = null;
        qaSelectedKey = 'main';
        qaQty = 1;
        qaAnchorEl = null;
        qaAdding = false;
        const qtyValue = document.getElementById('qaQtyValue');
        const qtyMinus = document.getElementById('qaQtyMinus');
        const qtyPlus = document.getElementById('qaQtyPlus');
        if (qtyValue) qtyValue.textContent = '1';
        if (qtyMinus) qtyMinus.disabled = true;
        if (qtyPlus) qtyPlus.disabled = false;
        document.removeEventListener('keydown', qaOnKeydown);
        if (typeof updateChatFabVisibility === 'function') updateChatFabVisibility();
    };

    async function qaAddToCart(payload) {
        // Prefer a dedicated request so we always get a real success/failure
        // (global addToCart is fire-and-forget and does not return a Promise).
        {% if session.get('user_id') %}
        const body = {
            product_id: payload.id,
            quantity: payload.quantity || 1
        };
        if (payload.variant_id) body.variant_id = payload.variant_id;

        const controller = (typeof AbortController !== 'undefined') ? new AbortController() : null;
        const timeoutId = controller ? setTimeout(function () { controller.abort(); }, 15000) : null;
        let response;
        try {
            response = await fetch('/api/cart/items', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'same-origin',
                body: JSON.stringify(body),
                signal: controller ? controller.signal : undefined
            });
        } finally {
            if (timeoutId) clearTimeout(timeoutId);
        }
        const data = await response.json().catch(function () { return {}; });
        if (!response.ok || !data.success) {
            throw new Error(data.error || 'Could not add to cart');
        }
        try {
            if (typeof window.loadCart === 'function') window.loadCart();
            if (typeof window.updateCartCount === 'function') window.updateCartCount();
        } catch (e) {
            console.warn('Cart UI refresh failed after add', e);
        }
        return true;
        {% else %}
        if (typeof window.addToCartLocalStorage === 'function') {
            window.addToCartLocalStorage(payload);
        } else if (typeof window.addToCart === 'function') {
            window.addToCart(payload);
        } else {
            throw new Error('Cart is unavailable');
        }
        try {
            if (typeof window.updateCartCount === 'function') window.updateCartCount();
        } catch (e) {
            console.warn('Cart count refresh failed after add', e);
        }
        return true;
        {% endif %}
    }

    window.confirmQuickAdd = async function () {
        if (!qaCurrentProduct || qaAdding) return;
        const options = buildOptions(qaCurrentProduct);
        const selected = options.find(function (o) { return o.key === qaSelectedKey; });
        if (!selected || !selected.in_stock) {
            if (typeof showToast === 'function') showToast('Please select an available option');
            return;
        }

        const max = Math.max(1, Number(selected.stock) || 1);
        const quantity = Math.min(Math.max(1, qaQty || 1), max);

        const confirmBtn = document.getElementById('qaConfirmBtn');
        const originalHtml = '<i class="ri-shopping-bag-line"></i><span id="qaConfirmLabel">' +
            (quantity > 1 ? ('Add ' + quantity + ' to basket') : 'Add to basket') + '</span>';
        qaAdding = true;
        if (confirmBtn) {
            confirmBtn.disabled = true;
            confirmBtn.innerHTML = '<i class="ri-loader-4-line ri-spin"></i><span>Adding…</span>';
        }
        const qtyMinus = document.getElementById('qaQtyMinus');
        const qtyPlus = document.getElementById('qaQtyPlus');
        if (qtyMinus) qtyMinus.disabled = true;
        if (qtyPlus) qtyPlus.disabled = true;

        const displayName = selected.variant_id
            ? (qaCurrentProduct.name + ' — ' + selected.name)
            : qaCurrentProduct.name;

        const payload = {
            id: qaCurrentProduct.id,
            name: displayName,
            price: selected.price,
            effective_price: selected.price,
            store_id: qaCurrentProduct.store_id || null,
            store_name: qaCurrentProduct.store_name || 'Flower Shop',
            image_url: selected.image_url || qaCurrentProduct.image_url || '',
            quantity: quantity
        };
        if (selected.variant_id) payload.variant_id = selected.variant_id;

        try {
            await qaAddToCart(payload);
            if (typeof showToast === 'function') {
                showToast(quantity > 1
                    ? (displayName + ' ×' + quantity + ' added to basket')
                    : (displayName + ' added to basket'));
            }
            closeQuickAddPicker();
        } catch (err) {
            console.error('Quick add failed', err);
            const msg = (err && err.name === 'AbortError')
                ? 'Request timed out — please try again'
                : ((err && err.message) ? err.message : 'Could not add to cart');
            if (typeof showToast === 'function') showToast(msg, 'error');
            if (confirmBtn) {
                confirmBtn.innerHTML = originalHtml;
                confirmBtn.disabled = false;
            }
            syncQuickAddQtyUI(selected);
        } finally {
            qaAdding = false;
        }
    };

    // Legacy helper kept for any leftover callers
    window.quickAdd = function (productId) {
        openQuickAddPicker(null, productId);
    };

    document.addEventListener('DOMContentLoaded', loadHomeProductsMap);
})();
</script>
